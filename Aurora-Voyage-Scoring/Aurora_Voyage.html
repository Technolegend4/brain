    padding-bottom:clamp(30px,5vh,54px);\n    font-size:10px;letter-spacing:.3em;color:rgba(200,214,240,.3);\n  }\n  footer a{color:rgba(240,214,164,.6);text-decoration:none;transition:color .3s;}\n  footer a:hover{color:#fff;}\n<\/style>\n<\/head>\n<body class=\"theme-galaxy\">\n<canvas id=\"sky\"><\/canvas>\n\n<header class=\"top\">\n  <a class=\"brand\" href=\"home.html\"><i class=\"dot\"><\/i><b>Aurora Lab<\/b><\/a>\n  <a class=\"back\" href=\"home.html\">返回星海<\/a>\n<\/header>\n\n<main>\n  <div class=\"kicker\">Connect<\/div>\n  <h1>这片星海，<em>听你的<\/em><\/h1>\n  <p class=\"lead\">换一种夜空的颜色，或者，往星海里丢一只漂流瓶——写下你此刻的感受、想法或建议，它们会被好好收在这里。<\/p>\n\n  <h3>Skin · 换一片夜空<\/h3>\n  <div class=\"skins\" id=\"skins\">\n    <button class=\"skin on\" data-skin=\"galaxy\">\n      <div class=\"swatch\"><i style=\"width:4px;height:4px;left:18%;top:30%\"><\/i><i style=\"width:3px;height:3px;left:44%;top:62%\"><\/i><i style=\"width:5px;height:5px;left:72%;top:28%;box-shadow:0 0 8px 3px rgba(255,238,205,.6)\"><\/i><i style=\"width:2px;height:2px;left:60%;top:74%\"><\/i><i style=\"width:3px;height:3px;left:30%;top:70%\"><\/i><\/div>\n      <div class=\"name\">星海夜空<\/div><div class=\"check\">✓<\/div>\n    <\/button>\n    <button class=\"skin\" data-skin=\"aurora\">\n      <div class=\"swatch\"><i style=\"width:4px;height:4px;left:22%;top:26%;background:#cffff0\"><\/i><i style=\"width:3px;height:3px;left:48%;top:58%;background:#cffff0\"><\/i><i style=\"width:5px;height:5px;left:74%;top:32%;background:#cffff0;box-shadow:0 0 8px 3px rgba(168,240,220,.6)\"><\/i><i style=\"width:2px;height:2px;left:62%;top:72%;background:#cffff0\"><\/i><\/div>\n      <div class=\"name\">极光绿<\/div><div class=\"check\">✓<\/div>\n    <\/button>\n    <button class=\"skin\" data-skin=\"amber\">\n      <div class=\"swatch\"><i style=\"width:4px;height:4px;left:20%;top:30%;background:#ffe4c0\"><\/i><i style=\"width:3px;height:3px;left:46%;top:60%;background:#ffe4c0\"><\/i><i style=\"width:5px;height:5px;left:70%;top:26%;background:#ffe4c0;box-shadow:0 0 8px 3px rgba(255,201,138,.6)\"><\/i><i style=\"width:2px;height:2px;left:58%;top:74%;background:#ffe4c0\"><\/i><\/div>\n      <div class=\"name\">暖金琥珀<\/div><div class=\"check\">✓<\/div>\n    <\/button>\n  <\/div>\n\n  <h3>Reflect · 写下此刻<\/h3>\n  <div class=\"moods\" id=\"moods\">\n    <button class=\"mood on\" data-mood=\"喜欢\">喜欢<\/button>\n    <button class=\"mood\" data-mood=\"平静\">平静<\/button>\n    <button class=\"mood\" data-mood=\"好奇\">好奇<\/button>\n    <button class=\"mood\" data-mood=\"惊喜\">惊喜<\/button>\n    <button class=\"mood\" data-mood=\"建议\">建议<\/button>\n    <button class=\"mood\" data-mood=\"吐槽\">吐槽<\/button>\n  <\/div>\n  <textarea id=\"fbText\" maxlength=\"300\" placeholder=\"今夜的星海，让你想起了什么？（最多 300 字）\"><\/textarea>\n  <div><button class=\"submit\" id=\"fbSend\">投 进 星 海<\/button><\/div>\n\n  <h3>Bottles · 漂流瓶<\/h3>\n  <div class=\"bottles\" id=\"bottles\"><\/div>\n<\/main>\n\n<footer><a href=\"home.html\">AURORA LAB<\/a> · 意识与星海的交界<\/footer>\n\n<div id=\"toast\"><\/div>\n\n<script>\n  // ---- 本地存储：统一加 av: 前缀，避免同域下别的项目用到同名 key 互相覆盖 ----\n  const LS = {\n    get(k){ try { return localStorage.getItem('av:' + k); } catch(e){ return null; } },\n    set(k,v){ try { localStorage.setItem('av:' + k, v); } catch(e){} }\n  };\n\n(function () {\n  'use strict';\n\n  /* ---------------- 主题化星海背景 ---------------- */\n  const TAU = Math.PI * 2;\n  function mulberry32(a) {\n    return function () {\n      a |= 0; a = (a + 0x6D2B79F5) | 0;\n      let t = Math.imul(a ^ (a >>> 15), 1 | a);\n      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n  }\n  const rnd = mulberry32(20261108);\n  const rr = (a, b) => a + rnd() * (b - a);\n\n  const canvas = document.getElementById('sky');\n  const ctx = canvas.getContext('2d', { alpha: false });\n  let W = 0, H = 0, DPR = 1, R = 0;\n  let stars = [];\n  let time = 0, lastT = 0;\n\n  const FLOW = { x: -0.882, y: 0.471 };\n\n  // 三套主题：背景渐变 + 星云色调 + 星色\n  const THEMES = {\n    galaxy: {\n      bg: ['#070c18', '#08101f', '#03050c'],\n      nebulas: [[70, 112, 190], [86, 96, 200], [150, 176, 240]],\n      core: [255, 250, 236],\n      starMix: 0.22   // 金色星占比\n    },\n    aurora: {\n      bg: ['#03121a', '#052a2e', '#020a0e'],\n      nebulas: [[40, 190, 160], [60, 150, 190], [140, 240, 210]],\n      core: [220, 255, 244],\n      starMix: 0.08\n    },\n    amber: {\n      bg: ['#140b04', '#2a1a0c', '#0c0703'],\n      nebulas: [[210, 140, 70], [190, 110, 60], [255, 205, 150]],\n      core: [255, 232, 200],\n      starMix: 0.5\n    }\n  };\n  const COLD = ['#ffffff', '#ffffff', '#f8fbff', '#e9f0ff', '#dfe8ff'];\n  const GOLD = ['#fff6e2', '#f6dfb6', '#e8c78d', '#ffeecd'];\n\n  let theme = 'galaxy';\n  let nebImg = null;\n\n  function starColors() {\n    const t = THEMES[theme];\n    return t.starMix > 0\n      ? COLD.concat(COLD, GOLD.slice(0, Math.round(GOLD.length * t.starMix * 2)))\n      : COLD.slice();\n  }\n\n  function resize() {\n    DPR = Math.min(window.devicePixelRatio || 1, 2);\n    W = window.innerWidth; H = window.innerHeight;\n    canvas.width = Math.round(W * DPR);\n    canvas.height = Math.round(H * DPR);\n    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';\n    R = Math.hypot(W, H) * 0.9;\n    buildStars();\n  }\n\n  function buildStars() {\n    stars = [];\n    const cols = starColors();\n    const dens = Math.min(W, H) < 720 ? 0.5 : 1;\n    const layers = [\n      { n: 340, sp: 4, size: [0.45, 1.0], a: 0.5, depth: 0.3 },\n      { n: 230, sp: 9, size: [0.6, 1.4], a: 0.7, depth: 0.6 },\n      { n: 110, sp: 18, size: [0.9, 1.9], a: 0.9, depth: 1 }\n    ];\n    for (let li = 0; li < layers.length; li++) {\n      const L = layers[li];\n      for (let i = 0; i < Math.round(L.n * dens); i++) {\n        stars.push({\n          x: rr(-R, R), y: rr(-R, R),\n          sp: L.sp * rr(0.7, 1.3), sz: rr(L.size[0], L.size[1]),\n          a: L.a * rr(0.65, 1),\n          col: cols[(rnd() * cols.length) | 0],\n          tw: rr(0.7, 2.6), ph: rr(0, TAU), depth: L.depth\n        });\n      }\n    }\n    for (let i = 0; i < Math.round(800 * dens); i++) {\n      const along = rr(-1, 1) * R * 0.95;\n      const perp = (rnd() + rnd() + rnd() - 1.5) * R * 0.11;\n      stars.push({\n        x: -0.707 * along + 0.707 * perp,\n        y: 0.707 * along + 0.707 * perp,\n        sp: rr(2, 7), sz: rr(0.3, 0.9), a: rr(0.25, 0.8),\n        col: rnd() < THEMES[theme].starMix ? GOLD[(rnd() * GOLD.length) | 0] : COLD[(rnd() * COLD.length) | 0],\n        tw: rr(0.6, 2.2), ph: rr(0, TAU), depth: rnd() < 0.3 ? 0.7 : 0.3\n      });\n    }\n    for (let i = 0; i < 10; i++) {\n      stars.push({\n        x: rr(-R, R), y: rr(-R, R),\n        sp: rr(3, 7), sz: rr(1.3, 2.2), a: rr(0.7, 1),\n        col: rnd() < 0.7 ? '#ffffff' : '#ffeecd',\n        tw: rr(0.5, 1.4), ph: rr(0, TAU), depth: rr(0.4, 1), glow: true\n      });\n    }\n  }\n\n  function buildNebula() {\n    const t = THEMES[theme];\n    const SZ = 900;\n    const cv = document.createElement('canvas');\n    cv.width = SZ; cv.height = SZ;\n    const g = cv.getContext('2d');\n    g.globalCompositeOperation = 'lighter';\n    for (let i = 0; i < 110; i++) {\n      const u = rnd();\n      const along = -0.55 + u * 1.1;\n      const n = (rnd() + rnd() + rnd() - 1.5) * 0.185;\n      const x = SZ * 0.5 + (along * 0.707 - n * 0.707) * SZ * 1.05;\n      const y = SZ * 0.5 + (-along * 0.707 - n * 0.707) * SZ * 1.05;\n      const r = rr(SZ * 0.04, SZ * 0.10);\n      const c = t.nebulas[(rnd() * t.nebulas.length) | 0];\n      const a = rr(0.012, 0.03);\n      const rad = g.createRadialGradient(x, y, 0, x, y, r);\n      rad.addColorStop(0, 'rgba(' + c.join(',') + ',' + a + ')');\n      rad.addColorStop(0.5, 'rgba(' + c.join(',') + ',' + (a * 0.3) + ')');\n      rad.addColorStop(1, 'rgba(' + c.join(',') + ',0)');\n      g.fillStyle = rad;\n      g.fillRect(x - r, y - r, r * 2, r * 2);\n    }\n    // 亮核\n    const cx = SZ * 0.64, cy = SZ * 0.36;\n    const cg = g.createRadialGradient(cx, cy, 0, cx, cy, SZ * 0.26);\n    cg.addColorStop(0, 'rgba(' + t.core.join(',') + ',0.15)');\n    cg.addColorStop(0.3, 'rgba(' + t.core.join(',') + ',0.07)');\n    cg.addColorStop(1, 'rgba(' + t.nebulas[0].join(',') + ',0)');\n    g.fillStyle = cg;\n    g.fillRect(0, 0, SZ, SZ);\n    nebImg = cv;\n  }\n\n  function setTheme(name, silent) {\n    theme = name;\n    document.body.className = 'theme-' + name;\n    document.querySelectorAll('.skin').forEach(function (el) {\n      el.classList.toggle('on', el.dataset.skin === name);\n    });\n    try { LS.set('aurora-skin', name); } catch (e) {}\n    buildNebula();\n    buildStars();\n    if (!silent) showToast('已切换到「' + ({ galaxy: '星海夜空', aurora: '极光绿', amber: '暖金琥珀' })[name] + '」');\n  }\n\n  function frame(now) {\n    if (!lastT) lastT = now;\n    let dt = Math.min((now - lastT) / 1000, 0.05);\n    lastT = now;\n    time += dt;\n\n    const t = THEMES[theme];\n    const gr = ctx.createLinearGradient(0, 0, W * 0.35, H);\n    gr.addColorStop(0, t.bg[0]);\n    gr.addColorStop(0.42, t.bg[1]);\n    gr.addColorStop(1, t.bg[2]);\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    ctx.globalCompositeOperation = 'source-over';\n    ctx.fillStyle = gr;\n    ctx.fillRect(0, 0, W, H);\n\n    if (nebImg) {\n      ctx.globalCompositeOperation = 'lighter';\n      ctx.save();\n      ctx.translate(W / 2, H * 0.44);\n      ctx.rotate(0.29);\n      const ns = (Math.hypot(W, H) * 1.2) / nebImg.width;\n      ctx.scale(ns, ns);\n      ctx.globalAlpha = 0.55;\n      ctx.drawImage(nebImg, -nebImg.width / 2, -nebImg.height / 2);\n      ctx.restore();\n      ctx.globalAlpha = 1;\n    }\n\n    ctx.globalCompositeOperation = 'lighter';\n    for (let i = 0; i < stars.length; i++) {\n      const s = stars[i];\n      s.x += FLOW.x * s.sp * dt;\n      s.y += FLOW.y * s.sp * dt;\n      if (s.x < -R) s.x += R * 2;\n      if (s.y > R) s.y -= R * 2;\n\n      const px = W / 2 + s.x;\n      const py = H / 2 + s.y;\n      if (px < -60 || px > W + 60 || py < -60 || py > H + 60) continue;\n\n      const tw = 0.62 + 0.38 * Math.sin(time * s.tw + s.ph);\n      const a = s.a * (0.55 + tw * 0.6);\n      if (a <= 0.012) continue;\n\n      if (s.glow) {\n        const grr = s.sz * 7;\n        const g2 = ctx.createRadialGradient(px, py, 0, px, py, grr);\n        g2.addColorStop(0, 'rgba(255,255,255,' + Math.min(1, a) + ')');\n        g2.addColorStop(0.12, 'rgba(255,252,240,' + (a * 0.8) + ')');\n        g2.addColorStop(0.32, 'rgba(255,238,204,' + (a * 0.16) + ')');\n        g2.addColorStop(1, 'rgba(255,226,180,0)');\n        ctx.fillStyle = g2;\n        ctx.beginPath(); ctx.arc(px, py, grr, 0, TAU); ctx.fill();\n        continue;\n      }\n      ctx.globalAlpha = Math.min(1, a * 1.1);\n      ctx.fillStyle = s.col;\n      if (s.sz < 0.85) {\n        ctx.fillRect(px - 0.55, py - 0.55, 1.1, 1.1);\n      } else {\n        ctx.beginPath(); ctx.arc(px, py, s.sz * 0.62, 0, TAU); ctx.fill();\n        if (s.sz > 1.5) {\n          const l = s.sz * 5.5;\n          ctx.globalAlpha = Math.min(0.4, a * 0.4);\n          ctx.strokeStyle = s.col; ctx.lineWidth = 0.7;\n          ctx.beginPath();\n          ctx.moveTo(px - l, py); ctx.lineTo(px + l, py);\n          ctx.moveTo(px, py - l); ctx.lineTo(px, py + l);\n          ctx.stroke();\n        }\n      }\n    }\n    ctx.globalAlpha = 1;\n\n    ctx.globalCompositeOperation = 'source-over';\n    const vg = ctx.createRadialGradient(W / 2, H * 0.48, Math.min(W, H) * 0.3, W / 2, H * 0.48, Math.hypot(W, H) * 0.7);\n    vg.addColorStop(0, 'rgba(2,4,10,0)');\n    vg.addColorStop(1, 'rgba(1,2,6,0.55)');\n    ctx.fillStyle = vg;\n    ctx.fillRect(0, 0, W, H);\n\n    requestAnimationFrame(frame);\n  }\n\n  /* ---------------- toast ---------------- */\n  const toastEl = document.getElementById('toast');\n  let toastTimer = 0;\n  function showToast(text) {\n    toastEl.textContent = text;\n    toastEl.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);\n  }\n\n  /* ---------------- 皮肤切换 ---------------- */\n  document.getElementById('skins').addEventListener('click', function (e) {\n    const btn = e.target.closest('.skin');\n    if (btn && btn.dataset.skin !== theme) setTheme(btn.dataset.skin);\n  });\n\n  /* ---------------- 心情标签 ---------------- */\n  let mood = '喜欢';\n  document.getElementById('moods').addEventListener('click', function (e) {\n    const btn = e.target.closest('.mood');\n    if (!btn) return;\n    mood = btn.dataset.mood;\n    document.querySelectorAll('.mood').forEach(function (el) {\n      el.classList.toggle('on', el === btn);\n    });\n  });\n\n  /* ---------------- 反馈漂流瓶 ---------------- */\n  const KEY = 'aurora-bottles';\n  function loadBottles() {\n    try { return JSON.parse(LS.get(KEY) || '[]'); } catch (e) { return []; }\n  }\n  function saveBottles(list) {\n    LS.set(KEY, JSON.stringify(list));\n  }\n  function renderBottles() {\n    const list = loadBottles();\n    const box = document.getElementById('bottles');\n    if (!list.length) {\n      box.innerHTML = '<div class=\"empty\">还没有漂流瓶——第一只，由你来投。<\/div>';\n      return;\n    }\n    // 转义后再拼进 HTML：localStorage 里的内容可能是被改过的，不能直接当 HTML 用\n    const esc = function (s) {\n      return String(s == null ? '' : s).replace(/[&<>\"']/g, function (c) {\n        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c];\n      });\n    };\n    box.innerHTML = list.map(function (b, i) {\n      return '<div class=\"bottle\"><div class=\"meta\"><span class=\"tag\">' +\n        esc(b.mood) + '<\/span><span>' + esc(b.date) + '<\/span><\/div><div class=\"txt\"><\/div><\/div>';\n    }).join('');\n    // 用 textContent 写正文，防止注入\n    const nodes = box.querySelectorAll('.bottle .txt');\n    list.forEach(function (b, i) { nodes[i].textContent = b.text; });\n  }\n\n  const fbText = document.getElementById('fbText');\n  const fbSend = document.getElementById('fbSend');\n  fbSend.addEventListener('click', function () {\n    const text = fbText.value.trim();\n    if (!text) {\n      showToast('先写点什么，再投进星海吧');\n      fbText.focus();\n      return;\n    }\n    const list = loadBottles();\n    const d = new Date();\n    const pad = function (n) { return (n < 10 ? '0' : '') + n; };\n    list.unshift({\n      mood: mood,\n      text: text.slice(0, 300),\n      date: d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes())\n    });\n    saveBottles(list.slice(0, 50));\n    fbText.value = '';\n    renderBottles();\n    showToast('漂流瓶已投进星海 ✦');\n  });\n\n  /* ---------------- 启动 ---------------- */\n  resize();\n  buildNebula();\n  requestAnimationFrame(frame);\n\n  window.addEventListener('resize', function () {\n    clearTimeout(window.__rzTimer);\n    window.__rzTimer = setTimeout(resize, 120);\n  });\n\n  // 恢复上次选择的皮肤（?skin=aurora 可指定）\n  try {\n    const q = (location.search.match(/skin=(galaxy|aurora|amber)/) || [])[1];\n    const saved = q || LS.get('aurora-skin');\n    if (saved && THEMES[saved]) setTheme(saved, true);\n  } catch (e) {}\n  renderBottles();\n})();\n<\/script>\n<script>\n/* nav.js —— 让同一套页面既能单独打开，也能装进单文件外壳的 iframe 里。\n *\n * 单独打开（window.parent === window）：链接正常跳转，什么都不做。\n * 在 iframe 里（单文件版外壳）：拦截页面内到其它页的链接，向父窗口发\n *   {nav: \"explore\"} 这样的消息，由外壳切换 iframe，避免整页重新加载。\n */\n(function () {\n  'use strict';\n\n  // 页面文件名 → 外壳里的 key。新增页面时在这里登记。\n  var MAP = {\n    'home.html': 'home',\n    'explore.html': 'explore',\n    'connect.html': 'connect',\n    'lab.html': 'lab'\n  };\n\n  var inFrame = false;\n  try { inFrame = window.parent && window.parent !== window; } catch (e) { inFrame = false; }\n  if (!inFrame) return;   // 单独打开：交给浏览器默认行为\n\n  function navigate(target) {\n    var key = MAP[target];\n    if (!key) return false;\n    parent.postMessage({ nav: key }, '*');\n    return true;\n  }\n\n  // 暴露给页面自己的 JS 用（如首页星图入口、游戏开始按钮）\n  window.auroraNav = navigate;\n  window.auroraInFrame = true;\n\n  // 捕获阶段拦截所有指向本组页面的 <a>\n  document.addEventListener('click', function (e) {\n    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n    if (!a) return;\n    var href = a.getAttribute('href') || '';\n    // 剥掉 query / hash，只比较文件名\n    var file = href.split('#')[0].split('?')[0].split('/').pop();\n    if (navigate(file)) e.preventDefault();\n  }, true);\n})();\n\n<\/script>\n\n<\/body>\n<\/html>\n",
"lab":"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n  <meta name=\"theme-color\" content=\"#03050c\">\n  <title>Blink Flight · 眨眼脑电 Flappy Bird<\/title>\n  <style>\n    :root{\n      --text:#eef4ff; --muted:rgba(190,205,230,.62);\n      --mono:\"DM Mono\",ui-monospace,SFMono-Regular,Menlo,monospace;\n      --gold:#ffe9c2; --gold-dim:rgba(255,233,194,.55);\n    }\n    *{box-sizing:border-box;margin:0;padding:0}\n    html,body{height:100%;overflow:hidden}\n    body{\n      background:linear-gradient(158deg,#070c18 0%,#08101f 42%,#03050c 100%);\n      color:var(--text);\n      font-family:Manrope,\"Noto Sans SC\",sans-serif;\n    }\n\n    /* ---------- 全屏星海背景（与首页 aurora-home 同一套渲染） ---------- */\n    #bgStars{position:fixed;inset:0;z-index:0;display:block}\n    /* 极淡的左侧压暗，只为让文字在星光上更清楚（不是框） */\n    .scrim{\n      position:fixed;inset:0;z-index:0;pointer-events:none;\n      background:\n        linear-gradient(90deg,rgba(3,6,14,.52) 0%,rgba(3,6,14,.26) 24%,rgba(3,6,14,.05) 40%,rgba(3,6,14,0) 48%),\n        radial-gradient(ellipse at 18% 100%,rgba(2,5,12,.45),transparent 62%);\n    }\n\n    /* ---------- 全屏布局：左列 1/3 可滚动（波形 / 参数 / 皮肤），右列 2/3 游戏 ---------- */\n    .stage{\n      position:fixed;inset:0;z-index:1;\n      display:grid;\n      grid-template-columns:minmax(300px,1fr) 2.02fr;\n      grid-template-rows:1fr;\n    }\n    .pane{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}\n    /* 左列整列竖向滚动：内容多时出现极细的香槟金滚动条 */\n    .left-rail{\n      grid-column:1;grid-row:1;min-height:0;\n      overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;\n      -webkit-overflow-scrolling:touch;\n      scrollbar-width:thin;scrollbar-color:rgba(255,236,200,.20) transparent;\n    }\n    .left-rail::-webkit-scrollbar{width:6px}\n    .left-rail::-webkit-scrollbar-track{background:transparent}\n    .left-rail::-webkit-scrollbar-thumb{\n      background:rgba(255,236,200,.16);border-radius:99px;\n    }\n    .left-rail::-webkit-scrollbar-thumb:hover{background:rgba(255,236,200,.34)}\n    .pane-eeg{padding:22px 22px 18px 28px;height:44vh;min-height:286px;flex:0 0 auto}\n    .pane-ctl{padding:24px 22px 16px 28px;flex:0 0 auto}\n    .pane-skin{padding:6px 22px 30px 28px;flex:0 0 auto}\n    .pane-game{grid-column:2;grid-row:1;padding:0}\n\n    /* 无框分隔：两条会自己淡出的细线 */\n    .pane-game::before{\n      content:\"\";position:absolute;left:0;top:5%;bottom:5%;width:1px;z-index:5;\n      background:linear-gradient(180deg,transparent,rgba(196,214,255,.20) 22%,rgba(196,214,255,.20) 78%,transparent);\n      pointer-events:none;\n    }\n    .pane-ctl::before{\n      content:\"\";position:absolute;left:26px;right:26px;top:0;height:1px;\n      background:linear-gradient(90deg,transparent,rgba(196,214,255,.18) 18%,rgba(196,214,255,.18) 82%,transparent);\n    }\n\n    .pane-label{\n      display:flex;align-items:center;gap:10px;\n      font:9.5px var(--mono);letter-spacing:2.4px;color:var(--muted);\n      text-shadow:0 1px 8px rgba(2,5,12,.9);\n    }\n    .pane-label::after{content:\"\";flex:1;height:1px;\n      background:linear-gradient(90deg,rgba(196,214,255,.20),transparent)}\n    .home-link{\n      margin-left:auto;font:10px var(--mono);letter-spacing:1.4px;\n      color:rgba(235,225,200,.72);text-decoration:none;transition:.25s;white-space:nowrap;\n    }\n    .home-link:hover{color:#fff;text-shadow:0 0 12px rgba(255,230,180,.6)}\n\n    /* ---------- 左上：实时脑电波形 ---------- */\n    .eeg-readout{display:flex;align-items:baseline;gap:14px;margin:14px 0 10px}\n    .eeg-readout b{\n      font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1;\n      color:#fff;text-shadow:0 0 18px rgba(120,220,255,.35);\n      font-variant-numeric:tabular-nums;\n    }\n    .eeg-readout small{font:10px var(--mono);letter-spacing:1.6px;color:var(--muted)}\n    .eeg-readout .thr{\n      margin-left:auto;text-align:right;\n      font:10px var(--mono);letter-spacing:1.4px;color:var(--gold-dim);\n    }\n    .eeg-readout .thr b{font-size:15px;color:var(--gold);text-shadow:0 0 12px rgba(255,220,150,.4)}\n    #waveCanvas{flex:1;width:100%;min-height:0;display:block}\n\n    /* ---------- 极简滑杆（无框风格） ---------- */\n    .ctl-list{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}\n    .ctl-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}\n    .ctl-row label{font-size:12.5px;letter-spacing:.6px;color:rgba(226,236,252,.86)}\n    .ctl-row label i{font:9px var(--mono);font-style:normal;letter-spacing:1.8px;color:rgba(190,205,230,.45);margin-left:8px}\n    .ctl-row output{\n      font:12px var(--mono);color:var(--gold);\n      font-variant-numeric:tabular-nums;\n      text-shadow:0 0 10px rgba(255,220,150,.35);\n    }\n    .ctl-row input{grid-column:1/3;width:100%}\n    input[type=range]{\n      -webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer;\n    }\n    input[type=range]::-webkit-slider-runnable-track{\n      height:2px;border-radius:2px;\n      background:linear-gradient(90deg,rgba(120,220,255,.5),rgba(255,225,170,.55));\n    }\n    input[type=range]::-webkit-slider-thumb{\n      -webkit-appearance:none;width:11px;height:11px;border-radius:50%;margin-top:-4.5px;\n      background:#fff;box-shadow:0 0 10px rgba(255,240,200,.85),0 0 3px rgba(120,220,255,.9);\n      transition:transform .15s;\n    }\n    input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.35)}\n    input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:rgba(190,215,255,.35)}\n    input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,240,200,.85)}\n    .ctl-actions{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}\n    .chip{\n      border:0;border-radius:999px;padding:7px 14px;cursor:pointer;transition:.22s;\n      font:600 10.5px Manrope,\"Noto Sans SC\",sans-serif;letter-spacing:.8px;\n      background:rgba(255,244,220,.07);color:rgba(255,240,214,.85);\n      border:1px solid rgba(255,236,200,.16);\n    }\n    .chip:hover{background:rgba(255,240,210,.14);color:#fff;border-color:rgba(255,236,200,.4);box-shadow:0 0 16px rgba(255,225,170,.18)}\n    .chip.accent{background:rgba(120,210,255,.10);color:#bfeaff;border-color:rgba(130,215,255,.25)}\n    .chip.accent:hover{background:rgba(120,210,255,.2);color:#fff;box-shadow:0 0 16px rgba(120,210,255,.25)}\n    .ctl-status{\n      margin-top:10px;font:9.5px var(--mono);letter-spacing:1px;line-height:1.6;\n      color:rgba(180,198,226,.5);min-height:14px;\n      text-shadow:0 1px 6px rgba(2,5,12,.9);\n    }\n\n    /* ---------- 皮肤选择：无框圆点色板 ---------- */\n    .skin-group{margin-top:16px}\n    .skin-group h4{\n      font:9px var(--mono);font-weight:400;letter-spacing:2px;\n      color:rgba(190,205,230,.44);margin-bottom:10px;\n    }\n    .swatches{display:flex;gap:16px}\n    .sw{\n      background:none;border:0;padding:0;cursor:pointer;\n      display:flex;flex-direction:column;align-items:center;gap:7px;\n    }\n    .sw .dot{\n      width:34px;height:34px;border-radius:50%;position:relative;\n      border:1px solid rgba(255,255,255,.13);\n      transition:transform .26s cubic-bezier(.2,.7,.3,1),box-shadow .26s,border-color .26s;\n    }\n    .sw .dot::after{\n      content:\"\";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;\n      border:1px solid rgba(255,244,214,0);transition:.26s;\n    }\n    .sw:hover .dot{transform:translateY(-2px) scale(1.06)}\n    .sw.on .dot{\n      border-color:rgba(255,244,214,.8);\n      box-shadow:0 0 18px rgba(255,226,170,.32);\n    }\n    .sw.on .dot::after{border-color:rgba(255,244,214,.20)}\n    .sw .lb{\n      font:9px var(--mono);letter-spacing:1.1px;white-space:nowrap;\n      color:rgba(190,205,230,.5);transition:.2s;\n    }\n    .sw.on .lb{color:#ffeecd;text-shadow:0 0 10px rgba(255,222,160,.35)}\n    /* 飞船皮肤：身体渐变预览 */\n    .sw-bird[data-key=\"galaxy\"] .dot{background:radial-gradient(circle at 32% 26%,#eafffb,#5fe0dc 46%,#7d78ff 100%)}\n    .sw-bird[data-key=\"aurora\"] .dot{background:radial-gradient(circle at 32% 26%,#eafff4,#4fe0a4 46%,#2f9d8a 100%)}\n    .sw-bird[data-key=\"amber\"]  .dot{background:radial-gradient(circle at 32% 26%,#fff7e6,#ffc86b 46%,#e8894a 100%)}\n    /* 背景皮肤：夜空渐变预览 + 一点星点 */\n    .sw-sky .dot::before{\n      content:\"\";position:absolute;left:26%;top:30%;width:2px;height:2px;border-radius:50%;\n      background:rgba(255,255,255,.85);box-shadow:6px 4px 0 -0.4px rgba(255,255,255,.5),-3px 7px 0 -0.4px rgba(255,255,255,.4);\n    }\n    .sw-sky[data-key=\"galaxy\"] .dot{background:linear-gradient(135deg,#070c18,#12203a 60%,#1a2c50)}\n    .sw-sky[data-key=\"aurora\"] .dot{background:linear-gradient(135deg,#04121a,#0a3a3a 55%,#0e5548)}\n    .sw-sky[data-key=\"amber\"]  .dot{background:linear-gradient(135deg,#140b04,#3a2410 55%,#57391a)}\n\n    /* ---------- 右侧：游戏区 ---------- */\n    #gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}\n    .score-hud{\n      position:absolute;top:22px;right:34px;z-index:4;text-align:right;white-space:nowrap;\n      font-family:var(--mono);pointer-events:none;\n      text-shadow:0 2px 14px rgba(2,5,12,.95);\n    }\n    .score-hud b{\n      display:block;font-size:42px;font-weight:400;line-height:1;color:#fff;\n      font-variant-numeric:tabular-nums;\n      text-shadow:0 0 22px rgba(150,220,255,.4),0 2px 14px rgba(2,5,12,.95);\n    }\n    .score-hud span{display:block;margin-top:6px;font-size:9.5px;letter-spacing:2.4px;color:var(--muted)}\n    .score-hud span em{font-style:normal;color:var(--gold-dim)}\n    .game-corner{\n      position:absolute;bottom:16px;right:24px;z-index:4;display:flex;gap:14px;align-items:center;\n      font:9.5px var(--mono);letter-spacing:1.6px;color:rgba(190,205,230,.55);\n      text-shadow:0 1px 8px rgba(2,5,12,.9);\n    }\n    .game-corner button{\n      background:none;border:0;cursor:pointer;color:rgba(235,225,200,.75);\n      font:10px var(--mono);letter-spacing:1.6px;transition:.2s;\n    }\n    .game-corner button:hover{color:#fff;text-shadow:0 0 10px rgba(255,230,180,.6)}\n    .brand-tag{\n      position:absolute;top:20px;left:28px;z-index:4;display:flex;align-items:center;gap:9px;\n      font:10px var(--mono);letter-spacing:2.2px;color:rgba(255,244,226,.9);\n      text-decoration:none;text-shadow:0 1px 10px rgba(2,5,12,.95),0 0 18px rgba(255,225,175,.22);transition:.25s;\n    }\n    .brand-tag:hover{color:#fff;text-shadow:0 0 16px rgba(255,230,180,.6)}\n    .brand-tag .dot{\n      width:7px;height:7px;border-radius:50%;background:var(--gold);\n      box-shadow:0 0 10px var(--gold);\n    }\n\n    /* ---------- 开始 / 结束浮层 ---------- */\n    .overlay{\n      position:absolute;inset:0;z-index:6;display:grid;place-items:center;text-align:center;\n      background:radial-gradient(ellipse at 50% 52%,rgba(4,10,22,.42) 0%,rgba(3,7,16,.58) 62%,rgba(2,5,12,.66) 100%);\n      backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);\n      transition:opacity .5s ease,visibility .5s ease;\n    }\n    .overlay.hidden{opacity:0;visibility:hidden}\n    .overlay .kicker{font:10px var(--mono);letter-spacing:3px;color:var(--gold-dim);margin-bottom:12px}\n    .overlay h2{font-size:30px;font-weight:700;letter-spacing:.5px;margin-bottom:10px;text-shadow:0 2px 24px rgba(2,5,12,.9)}\n    .overlay p{font-size:12.5px;color:rgba(205,220,240,.75);margin-bottom:24px;line-height:1.8}\n    .primary-btn{\n      border:0;border-radius:999px;padding:13px 30px;cursor:pointer;transition:.25s;\n      font:600 12.5px Manrope,\"Noto Sans SC\",sans-serif;letter-spacing:2px;\n      background:rgba(255,244,220,.10);color:#fff;\n      border:1px solid rgba(255,236,200,.35);\n      box-shadow:0 0 24px rgba(255,225,170,.12);\n    }\n    .primary-btn:hover{\n      background:rgba(255,240,210,.2);transform:translateY(-2px);\n      box-shadow:0 0 34px rgba(255,225,170,.3);\n    }\n\n    /* ---------- 窄屏：纵向堆叠 ---------- */\n    @media(max-width:860px){\n      html,body{overflow:auto}\n      .stage{position:relative;inset:auto;grid-template-columns:1fr;grid-template-rows:auto;min-height:100%}\n      .left-rail{grid-column:1;grid-row:2;overflow:visible;height:auto}\n      .pane-game{grid-column:1;grid-row:1;height:56vh;min-height:320px}\n      .pane-eeg{grid-column:1;grid-row:auto;height:276px;padding:14px 18px 18px}\n      .pane-ctl{grid-column:1;grid-row:auto;height:auto;padding:24px 18px 26px}\n      .pane-skin{grid-column:1;grid-row:auto;padding:0 18px 30px}\n      .pane-ctl::before{left:18px;right:18px}\n      .pane-game::before{display:none}\n      .eeg-readout b{font-size:28px}\n      .score-hud b{font-size:30px}\n    }\n  <\/style>\n<\/head>\n<body>\n  <canvas id=\"bgStars\" aria-hidden=\"true\"><\/canvas>\n  <div class=\"scrim\" aria-hidden=\"true\"><\/div>\n\n  <div class=\"stage\">\n    <!-- 左列 1/3：整列可滚动 -->\n    <div class=\"left-rail\">\n    <!-- 左上：实时脑电波形 -->\n    <section class=\"pane pane-eeg\" aria-label=\"实时脑电波形\">\n      <div class=\"pane-label\">\n        LIVE EEG · 实时脑电\n        <a class=\"home-link\" href=\"home.html\">✦ 返回星海<\/a>\n      <\/div>\n      <div class=\"eeg-readout\">\n        <b id=\"signalBig\">12<\/b>\n        <small>BLINK INTENSITY<\/small>\n        <div class=\"thr\">THRESHOLD <b id=\"thresholdValue\">50<\/b><\/div>\n      <\/div>\n      <canvas id=\"waveCanvas\" aria-hidden=\"true\"><\/canvas>\n      <div class=\"ctl-row\" style=\"margin-top:8px\">\n        <label>眨眼阈值<i>THRESHOLD<\/i><\/label>\n        <output id=\"thrOut\">50<\/output>\n        <input id=\"thresholdSlider\" type=\"range\" min=\"5\" max=\"100\" value=\"50\">\n      <\/div>\n    <\/section>\n\n    <!-- 左下：游戏参数调节 -->\n    <section class=\"pane pane-ctl\" aria-label=\"游戏参数调节\">\n      <div class=\"pane-label\">FLIGHT TUNING · 参数调节<\/div>\n      <div class=\"ctl-list\">\n        <div class=\"ctl-row\">\n          <label>上下管道间距<i>PIPE GAP<\/i><\/label>\n          <output id=\"gapOut\">200 px<\/output>\n          <input id=\"gapSlider\" type=\"range\" min=\"140\" max=\"280\" value=\"200\">\n        <\/div>\n        <div class=\"ctl-row\">\n          <label>相邻管道间距<i>SPACING<\/i><\/label>\n          <output id=\"spacingOut\">240 px<\/output>\n          <input id=\"spacingSlider\" type=\"range\" min=\"150\" max=\"360\" value=\"240\">\n        <\/div>\n        <div class=\"ctl-row\">\n          <label>飞船下落速度<i>FALL SPEED<\/i><\/label>\n          <output id=\"gravOut\">1.0×<\/output>\n          <input id=\"gravSlider\" type=\"range\" min=\"12\" max=\"32\" value=\"20\">\n        <\/div>\n        <div class=\"ctl-row\">\n          <label>跳跃力度<i>FLAP POWER<\/i><\/label>\n          <output id=\"flapOut\">6.8<\/output>\n          <input id=\"flapSlider\" type=\"range\" min=\"40\" max=\"100\" value=\"68\">\n        <\/div>\n      <\/div>\n      <div class=\"ctl-actions\">\n        <button class=\"chip accent\" id=\"simulateBlinkBtn\">测试一次眨眼<\/button>\n        <button class=\"chip\" id=\"resetSignalBtn\">重置信号<\/button>\n        <button class=\"chip\" id=\"connectBtn\">连接 Python<\/button>\n      <\/div>\n      <div class=\"ctl-status\" id=\"connectionLog\">模拟信号模式 · WebSocket ws://127.0.0.1:7000 待连接<\/div>\n    <\/section>\n\n    <!-- 左下：皮肤选择 -->\n    <section class=\"pane pane-skin\" aria-label=\"皮肤选择\">\n      <div class=\"pane-label\">SKIN · 皮肤<\/div>\n\n      <div class=\"skin-group\">\n        <h4>飞船 · SHIP<\/h4>\n        <div class=\"swatches\">\n          <button class=\"sw sw-bird\" data-group=\"bird\" data-key=\"galaxy\" title=\"星海蓝：青蓝身、紫尾羽\">\n            <span class=\"dot\"><\/span><span class=\"lb\">星海蓝<\/span>\n          <\/button>\n          <button class=\"sw sw-bird\" data-group=\"bird\" data-key=\"aurora\" title=\"极光翠：翠绿身、薄荷翼\">\n            <span class=\"dot\"><\/span><span class=\"lb\">极光翠<\/span>\n          <\/button>\n          <button class=\"sw sw-bird\" data-group=\"bird\" data-key=\"amber\" title=\"琥珀金：暖金身、杏色翼\">\n            <span class=\"dot\"><\/span><span class=\"lb\">琥珀金<\/span>\n          <\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"skin-group\">\n        <h4>背景 · SKY<\/h4>\n        <div class=\"swatches\">\n          <button class=\"sw sw-sky\" data-group=\"sky\" data-key=\"galaxy\" title=\"星海夜空：深蓝银河\">\n            <span class=\"dot\"><\/span><span class=\"lb\">星海夜空<\/span>\n          <\/button>\n          <button class=\"sw sw-sky\" data-group=\"sky\" data-key=\"aurora\" title=\"极光绿：青绿极光与森林雾\">\n            <span class=\"dot\"><\/span><span class=\"lb\">极光绿<\/span>\n          <\/button>\n          <button class=\"sw sw-sky\" data-group=\"sky\" data-key=\"amber\" title=\"暖金琥珀：暗金琥珀霞光\">\n            <span class=\"dot\"><\/span><span class=\"lb\">暖金琥珀<\/span>\n          <\/button>\n        <\/div>\n      <\/div>\n    <\/section>\n    <\/div><!-- /left-rail -->\n\n    <!-- 右侧：游戏区 -->\n    <section class=\"pane pane-game\" aria-label=\"游戏区域\">\n      <canvas id=\"gameCanvas\" aria-label=\"眨眼控制飞行游戏\"><\/canvas>\n\n      <a class=\"brand-tag\" href=\"home.html\"><span class=\"dot\"><\/span>BLINK FLIGHT<\/a>\n      <div class=\"score-hud\">\n        <b id=\"score\">0<\/b>\n        <span>SCORE · BEST <em id=\"best\">0<\/em><\/span>\n      <\/div>\n\n      <div class=\"overlay\" id=\"startOverlay\">\n        <div>\n          <p class=\"kicker\">READY WHEN YOU ARE<\/p>\n          <h2>准备起飞？<\/h2>\n          <p>眨眼 / 点击 / 按空格，让飞船向上飞。<br>左侧可调节管道与下落参数，还能换飞船和星空的皮肤。<\/p>\n          <button class=\"primary-btn\" id=\"startBtn\">开始游戏<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"overlay hidden\" id=\"overOverlay\">\n        <div>\n          <p class=\"kicker\">FLIGHT COMPLETE<\/p>\n          <h2>本次飞行结束<\/h2>\n          <p>本次得分 <b id=\"finalScore\">0<\/b><\/p>\n          <button class=\"primary-btn\" id=\"restartBtn\">再飞一次<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"game-corner\">\n        <span>SPACE / CLICK / BLINK TO FLY<\/span>\n        <button id=\"pauseBtn\">暂停<\/button>\n      <\/div>\n    <\/section>\n  <\/div>\n\n  <script>\n(() => {\n  // ---- 本地存储：统一加 av: 前缀，避免同域下别的项目用到同名 key 互相覆盖 ----\n  const LS = {\n    get(k){ try { return localStorage.getItem('av:' + k); } catch(e){ return null; } },\n    set(k,v){ try { localStorage.setItem('av:' + k, v); } catch(e){} }\n  };\n\n  const canvas = document.getElementById('gameCanvas');\n  const ctx = canvas.getContext('2d');\n  const $ = id => document.getElementById(id);\n  const gamePane = canvas.parentElement;\n\n  // ---- 可变画布尺寸：游戏区随窗口自适应 ----\n  let W = 900, H = 500;\n  let bird = {x: W*0.2, y: H*0.45, vy: 0, r: 16, rot: 0};\n  let pipes = [];\n  function sizeGame() {\n    const r = gamePane.getBoundingClientRect();\n    if (r.width < 50 || r.height < 50) return;   // 隐藏中/布局未完成时跳过\n    const nW = Math.round(r.width), nH = Math.round(r.height);\n    if (nW === W && nH === H) return;            // 尺寸没变就不动，避免每帧重设 canvas 清空画面\n\n    // 游玩中改尺寸时，按比例搬移飞船与管道，否则新管道会从旧坐标系生成、\n    // 飞船也可能一下子就跑到墙外（表现为「一拉窗口就死」）\n    const sx = nW / W, sy = nH / H;\n    if (typeof bird !== 'undefined' && bird) { bird.x *= sx; bird.y *= sy; }\n    if (typeof pipes !== 'undefined' && pipes) {\n      for (const p of pipes) { p.x *= sx; p.top *= sy; p.bottom *= sy; }\n    }\n\n    W = nW; H = nH;\n    canvas.width = W; canvas.height = H;\n  }\n  sizeGame();\n  // 首次调用时（尤其单文件外壳里 iframe 是 display:none 时才建 srcdoc）\n  // 可能量到 0×0 直接返回。多重兜底：ResizeObserver 盯游戏区本身 + 启动后\n  // 短轮询几次，确保布局稳定后一定能拿到真实尺寸。\n  if (window.ResizeObserver) {\n    new ResizeObserver(function () { sizeGame(); }).observe(gamePane);\n  }\n  window.addEventListener('load', function () { sizeGame(); sizeWave(); });\n  // 启动后 0.1s / 0.4s / 1s 再各量一次，兜住 ResizeObserver 漏报的情况\n  [100, 400, 1000].forEach(function (ms) {\n    setTimeout(function () { sizeGame(); sizeWave(); }, ms);\n  });\n\n  let state = 'ready', score = 0, best = Number(LS.get('blinkFlightBest') || 0);\n  let frame = 0, world = 0, lastTime = 0, pausedFrom = 'playing';\n  let threshold = 50, signalValue = 12, wasAbove = false, lastTrigger = 0, endAt = 0;\n  let ws = null;\n  // ---- 可调参数（左下面板） ----\n  let pipeGap = 200;          // 上下管道间距 px\n  let spacingFrames = 185;    // 相邻管道间隔（frame 数），水平距离 = 间距 × 1.3 px\n  let grav = 0.20;            // 下落加速度\n  const MAX_FALL = 2.5;\n  $('best').textContent = best;\n  $('thresholdValue').textContent = threshold;\n\n  /* ================= 皮肤系统（与反馈页三色一致：星海 / 极光 / 琥珀） ================= */\n  const BIRD_SKINS = {\n    galaxy: {\n      b0:'#e6fffb', b1:'#5fe0dc', b2:'#8b86ff',\n      wing0:'#c6fff8', wing1:'#74d2ff', crest:'#a9f8ff',\n      tail:'rgba(150,232,255,.52)', beak:'#ffcf87', eye:'#101f38',\n      rim:'rgba(220,255,252,.72)',\n      halo:'rgba(120,232,255,.30)', halo2:'rgba(126,146,255,.13)'\n    },\n    aurora: {\n      b0:'#f2fff8', b1:'#4fe0a4', b2:'#2f9d8a',\n      wing0:'#dbffec', wing1:'#63e2b4', crest:'#bcffdd',\n      tail:'rgba(150,255,208,.5)', beak:'#ffe6a8', eye:'#0c2a21',\n      rim:'rgba(226,255,240,.72)',\n      halo:'rgba(96,255,190,.28)', halo2:'rgba(150,255,215,.12)'\n    },\n    amber: {\n      b0:'#fffaea', b1:'#ffc86b', b2:'#e8894a',\n      wing0:'#ffeec6', wing1:'#f3a959', crest:'#ffe0a6',\n      tail:'rgba(255,214,148,.5)', beak:'#ffeec2', eye:'#2c1a0d',\n      rim:'rgba(255,246,214,.75)',\n      halo:'rgba(255,200,112,.30)', halo2:'rgba(255,160,92,.13)'\n    }\n  };\n  // 背景皮肤：body=页面底色 / glass=管道玻璃 / gate=管口光 / rim=外缘 / glow=空间柔光 / mist=地面雾 / line+dash=地平线\n  const SKY_SKINS = {\n    galaxy: {\n      body:['#070c18','#08101f','#03050c'],\n      glass:[[28,58,92],[96,150,190],[120,175,210],[70,120,165],[18,42,72]],\n      gate:[255,247,226], rim:[206,238,255], glow:[96,168,215],\n      mist:[6,14,26], line:[92,225,230], dash:[110,190,215]\n    },\n    aurora: {\n      body:['#05130f','#061b18','#020a08'],\n      glass:[[22,70,58],[64,178,144],[104,214,178],[52,148,124],[13,48,42]],\n      gate:[210,255,236], rim:[190,255,226], glow:[88,214,164],\n      mist:[4,18,15], line:[110,245,200], dash:[120,224,188]\n    },\n    amber: {\n      body:['#150d07','#1c1208','#0b0603'],\n      glass:[[78,48,26],[188,134,70],[218,168,104],[148,100,54],[54,32,18]],\n      gate:[255,226,170], rim:[255,232,196], glow:[235,170,95],\n      mist:[20,12,6], line:[255,196,120], dash:[240,190,130]\n    }\n  };\n  let birdSkin = LS.get('blinkBirdSkin') || 'galaxy';\n  let skySkin = LS.get('blinkSkySkin') || 'galaxy';\n  if (!BIRD_SKINS[birdSkin]) birdSkin = 'galaxy';\n  if (!SKY_SKINS[skySkin]) skySkin = 'galaxy';\n  const BD = () => BIRD_SKINS[birdSkin];\n  const SK = () => SKY_SKINS[skySkin];\n  const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';\n\n  function applySky(key) {\n    const k = SKY_SKINS[key] || SKY_SKINS.galaxy;\n    document.body.style.background =\n      'linear-gradient(158deg,' + k.body[0] + ' 0%,' + k.body[1] + ' 42%,' + k.body[2] + ' 100%)';\n    // 星海画布（另一段脚本）同步换色\n    if (typeof window.__applySkySkin === 'function') window.__applySkySkin(key);\n  }\n  function paintSwatches() {\n    document.querySelectorAll('.sw').forEach(function (el) {\n      const grp = el.dataset.group;\n      el.classList.toggle('on', grp === 'bird' ? el.dataset.key === birdSkin : el.dataset.key === skySkin);\n    });\n  }\n  document.querySelectorAll('.sw').forEach(function (el) {\n    el.addEventListener('click', function () {\n      if (el.dataset.group === 'bird') {\n        birdSkin = el.dataset.key;\n        try { LS.set('blinkBirdSkin', birdSkin); } catch (e) {}\n      } else {\n        skySkin = el.dataset.key;\n        try { LS.set('blinkSkySkin', skySkin); } catch (e) {}\n        applySky(skySkin);\n      }\n      paintSwatches();\n    });\n  });\n  paintSwatches();\n  applySky(skySkin);\n\n  // 尺寸非法的矩形直接跳过：canvas.roundRect 遇到负宽高会抛 IndexSizeError，\n  // 一旦抛出整个 requestAnimationFrame 循环就会永久停住（表现为\"过一会儿眨眼也不动了\"）\n  function roundedRect(x,y,w,h,r,fill){if(!(w>0)||!(h>0))return;ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}\n  function drawBackground(){\n    // 不再铺不透明底色：清空后让页面星海背景透上来，游戏区与首页同一片星空\n    ctx.clearRect(0,0,W,H);\n    const k = SK();\n    // 空间柔光（随皮肤换色，很淡，只做层次）\n    const glow=ctx.createRadialGradient(W*0.72,H*0.42,20,W*0.72,H*0.42,Math.max(W,H)*0.55);\n    glow.addColorStop(0,rgba(k.glow,.13));\n    glow.addColorStop(.55,rgba(k.glow,.05));\n    glow.addColorStop(1,rgba(k.glow,0));\n    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);\n    // 地面：柔和的底部雾霭 + 一条会流动的光带（没有硬边色块）\n    const mist=ctx.createLinearGradient(0,H*0.6,0,H);\n    mist.addColorStop(0,rgba(k.mist,0));\n    mist.addColorStop(.55,rgba(k.mist,.30));\n    mist.addColorStop(1,rgba(k.mist,.62));\n    ctx.fillStyle=mist;ctx.fillRect(0,H*0.6,W,H*0.4);\n    ctx.fillStyle=rgba(k.line,.55);ctx.fillRect(0,H-30,W,1.4);\n    for(let x=-(world%50);x<W;x+=50){ctx.fillStyle=rgba(k.dash,.22);ctx.fillRect(x,H-16,24,1.5);}\n  }\n  // ---- 太空飞船：尖鼻机身 + 后掠翼 + 尾鳍 + 尾喷口 + 座舱罩（配色跟随飞船皮肤）----\n  function drawBird(){\n    const s = BD();\n    const t = performance.now()/1000;\n    const thrust = 0.5 + Math.max(-0.3, Math.min(0.5, -bird.vy*0.10));\n    const flick = 0.86 + Math.sin(t*24)*0.09 + Math.sin(t*8.1)*0.05;\n\n    ctx.save();\n    ctx.translate(bird.x, bird.y);\n    ctx.rotate(bird.rot);\n    ctx.scale(1.02, 1.02);\n\n    // 1) 光晕（收敛一些，别糊掉剪影）\n    ctx.globalCompositeOperation = 'lighter';\n    const halo = ctx.createRadialGradient(0,0,6,0,0,32);\n    halo.addColorStop(0, s.halo);\n    halo.addColorStop(.6, s.halo2);\n    halo.addColorStop(1, 'rgba(0,0,0,0)');\n    ctx.fillStyle = halo;\n    ctx.beginPath(); ctx.arc(0,0,32,0,Math.PI*2); ctx.fill();\n    ctx.globalCompositeOperation = 'source-over';\n\n    // 2) 尾焰：细长喷焰（外焰橘 + 内芯白）\n    const flameLen = (13 + 9*thrust) * flick;\n    ctx.globalCompositeOperation = 'lighter';\n    let fg = ctx.createLinearGradient(-15.5,0,-15.5-flameLen,0);\n    fg.addColorStop(0,'rgba(255,238,200,.95)');\n    fg.addColorStop(.4,'rgba(255,178,96,.7)');\n    fg.addColorStop(1,'rgba(255,110,50,0)');\n    ctx.fillStyle = fg;\n    ctx.beginPath();\n    ctx.moveTo(-15.2,-3.0);\n    ctx.quadraticCurveTo(-15.5-flameLen*0.5,-1.4,-15.5-flameLen,0);\n    ctx.quadraticCurveTo(-15.5-flameLen*0.5,1.4,-15.2,3.0);\n    ctx.closePath(); ctx.fill();\n    const coreLen = flameLen*0.42;\n    fg = ctx.createLinearGradient(-15.5,0,-15.5-coreLen,0);\n    fg.addColorStop(0,'rgba(255,255,255,.95)');\n    fg.addColorStop(1,'rgba(255,245,205,0)');\n    ctx.fillStyle = fg;\n    ctx.beginPath();\n    ctx.moveTo(-15.4,-1.4);\n    ctx.quadraticCurveTo(-15.5-coreLen*0.55,-0.5,-15.5-coreLen,0);\n    ctx.quadraticCurveTo(-15.5-coreLen*0.55,0.5,-15.4,1.4);\n    ctx.closePath(); ctx.fill();\n    ctx.globalCompositeOperation = 'source-over';\n\n    // 3) 尾喷口：深色环，锚定尾部轮廓\n    ctx.beginPath();\n    ctx.moveTo(-12.4,-4.6); ctx.lineTo(-15.8,-3.4);\n    ctx.lineTo(-15.8,3.4); ctx.lineTo(-12.4,4.6);\n    ctx.closePath();\n    ctx.fillStyle = s.b2; ctx.fill();\n    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = .9; ctx.stroke();\n\n    // 4) 尾鳍（上）\n    ctx.fillStyle = s.crest;\n    ctx.beginPath();\n    ctx.moveTo(-6.4,-6.2);\n    ctx.lineTo(-10.6,-13.4);\n    ctx.lineTo(-14.2,-12.2);\n    ctx.lineTo(-9.6,-5.4);\n    ctx.closePath();\n    ctx.fill();\n    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=.7; ctx.stroke();\n\n    // 5) 后掠主翼（上，带亮边与翼尖灯）\n    ctx.save();\n    ctx.translate(0,-1.4);\n    const wg = ctx.createLinearGradient(6,-2,-14,-11);\n    wg.addColorStop(0, s.b1);\n    wg.addColorStop(.55, s.wing1);\n    wg.addColorStop(1, s.b2);\n    ctx.fillStyle = wg;\n    ctx.beginPath();\n    ctx.moveTo(9.5,-2.0);\n    ctx.lineTo(2.0,-5.0);\n    ctx.lineTo(-11.6,-11.2);\n    ctx.lineTo(-17.4,-11.8);\n    ctx.lineTo(-12.2,-6.2);\n    ctx.lineTo(-3.0,-3.0);\n    ctx.closePath();\n    ctx.fill();\n    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1;\n    ctx.beginPath(); ctx.moveTo(9.0,-2.2); ctx.lineTo(-11.3,-11.0); ctx.stroke();\n    const lampA = 0.35 + 0.5*Math.abs(Math.sin(t*2.6));\n    ctx.fillStyle = 'rgba(150,255,220,'+lampA.toFixed(2)+')';\n    ctx.shadowColor='rgba(150,255,220,.9)'; ctx.shadowBlur=7;\n    ctx.beginPath(); ctx.arc(-16.6,-11.6,1.25,0,Math.PI*2); ctx.fill();\n    ctx.shadowBlur=0;\n    ctx.restore();\n\n    // 5b) 前置小翼（鸭翼）：让剪影更像飞船而不是火箭\n    ctx.save();\n    ctx.translate(13.6,-3.2);\n    ctx.fillStyle = s.wing0;\n    ctx.beginPath();\n    ctx.moveTo(4.2,-0.6);\n    ctx.lineTo(-1.0,-2.6);\n    ctx.lineTo(-6.0,-5.4);\n    ctx.lineTo(-3.2,-2.0);\n    ctx.lineTo(2.4,0.2);\n    ctx.closePath();\n    ctx.fill();\n    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=.6; ctx.stroke();\n    ctx.restore();\n\n    // 6) 腹鳍（下，较小）\n    ctx.fillStyle = s.tail;\n    ctx.beginPath();\n    ctx.moveTo(2.0,4.4);\n    ctx.lineTo(-3.0,5.8);\n    ctx.lineTo(-8.6,10.4);\n    ctx.lineTo(-12.0,9.6);\n    ctx.lineTo(-8.0,5.2);\n    ctx.lineTo(-1.0,3.8);\n    ctx.closePath();\n    ctx.fill();\n    ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=.7; ctx.stroke();\n\n    // 7) 机身：尖鼻流线 + 上下双色分面\n    const bodyPath = () => {\n      ctx.beginPath();\n      ctx.moveTo(26.0, -0.2);\n      ctx.bezierCurveTo(21.5, -4.6, 14.0, -7.0, 4.0, -7.2);\n      ctx.lineTo(-11.0, -5.8);\n      ctx.lineTo(-13.0, -4.6);\n      ctx.lineTo(-13.0, 4.4);\n      ctx.lineTo(-11.0, 5.6);\n      ctx.lineTo(4.0, 6.9);\n      ctx.bezierCurveTo(14.0, 6.6, 21.5, 4.2, 26.0, -0.2);\n      ctx.closePath();\n    };\n    bodyPath();\n    const bg = ctx.createLinearGradient(0,-8.4,0,8.0);\n    bg.addColorStop(0, s.b2);\n    bg.addColorStop(.42, s.b1);\n    bg.addColorStop(1, s.b0);\n    ctx.fillStyle = bg;\n    ctx.fill();\n    // 背脊高光带\n    ctx.save(); bodyPath(); ctx.clip();\n    const sheen = ctx.createLinearGradient(0,-8,0,1);\n    sheen.addColorStop(0,'rgba(255,255,255,.30)');\n    sheen.addColorStop(1,'rgba(255,255,255,0)');\n    ctx.fillStyle = s =='number')setSignal(d.value,false);\n      else if(typeof d.blink_strength==='number')setSignal(d.blink_strength,false);\n      else log('收到数据，但格式不匹配。请发送 {\"value\": 数字}');\n    }catch(err){log('收到非 JSON 数据。请发送 JSON，例如 {\"value\": 68}');}\n  }\n  window.addEventListener('message',function(e){\n    const d=e.data||{};\n    if(!relayMode)return;\n    if(d.wsState==='open'){relayOpen=true;retryCount=0;$('connectBtn').textContent='断开连接';log('已连接 Python · 实时脑电波形显示中，眨眼即跳跃');}\n    else if(d.wsState==='error'){relayOpen=false;$('connectBtn').textContent='重新连接';log('连接失败：请先启动本地 Python WebSocket 服务。仍可用模拟测试。');}\n    else if(d.wsState==='close'){\n      relayOpen=false;\n      // 连接意外中断（接收器重启/半死连接）：自动重连，最多 8 次\n      if(retryCount<8){\n        retryCount++;\n        $('connectBtn').textContent='重连中…';\n        log('连接中断，正在自动重连（第 '+retryCount+' 次）…');\n        setTimeout(()=>{if(relayMode&&!relayOpen)parent.postMessage({wsCmd:'open',url:WS_URL},'*');},1200);\n      }else{$('connectBtn').textContent='连接 Python';log('连接已断开 · 请确认接收器正在运行后重新连接');}\n    }\n    else if(typeof d.wsData==='string'){handleMsg(d.wsData);}\n  });\n  $('connectBtn').addEventListener('click',()=>{\n    // 合并版：走外壳代理\n    if(window.parent&&window.parent!==window){\n      relayMode=true;\n      if(relayOpen){parent.postMessage({wsCmd:'close'},'*');relayOpen=false;$('connectBtn').textContent='连接 Python';log('模拟信号模式 · 已断开');return;}\n      $('connectBtn').textContent='正在连接…';\n      parent.postMessage({wsCmd:'open',url:WS_URL},'*');\n      setTimeout(()=>{if(!relayOpen&&$('connectBtn').textContent==='正在连接…'){log('连接失败：请先启动本地 Python WebSocket 服务。仍可用模拟测试。');$('connectBtn').textContent='重新连接';}},7000);\n      return;\n    }\n    // 独立打开：直连\n    if(ws&&ws.readyState===WebSocket.OPEN){ws.close();return;}\n    try{\n      ws=new WebSocket(WS_URL);\n      $('connectBtn').textContent='正在连接…';\n      ws.onopen=()=>{$('connectBtn').textContent='断开连接';log('已连接 Python · 实时脑电波形显示中，眨眼即跳跃');};\n      ws.onmessage=ev=>handleMsg(ev.data);\n      ws.onerror=()=>{log('连接失败：请先启动本地 Python WebSocket 服务。仍可用模拟测试。');$('connectBtn').textContent='重新连接';};\n      ws.onclose=()=>{$('connectBtn').textContent='连接 Python';log('模拟信号模式 · WebSocket 待连接');};\n    }catch(e){log('浏览器无法建立连接。');}\n  });\n\n  // ---- 波形：平时平线，飞船推进（=检测到眨眼）时生成随机高度波峰 ----\n  // 波峰以队列方式逐点进入历史，与波形滚动节奏一致\n  let spikeQueue = [];\n  function pushSpike(){\n    const h = 55 + Math.random() * 40;   // 峰高 55~95，每次随机\n    for(let i = 1; i <= 3; i++) spikeQueue.push(12 + (h - 12) * i / 4);  // 上升沿\n    spikeQueue.push(h);                                                   // 峰顶\n    for(let i = 3; i >= 1; i--) spikeQueue.push(12 + (h - 12) * i / 4);  // 下降沿\n  }\n  let wfLast = 0;\n  function waveLoop(t) {\n    if (t - wfLast > 45) {\n      wfLast = t;\n      if(!realWave){\n        if (spikeQueue.length) {\n          // 波峰播放中：逐点输出，不叠底噪\n          waveHist.push(spikeQueue.shift());\n        } else {\n          // 平线：静息值 12 + 极轻微噪声\n          waveHist.push(12 + (Math.random() - 0.5) * 2.4);\n        }\n        const maxN = Math.ceil(waveCv.width / 3) + 4;\n        while (waveHist.length > maxN) waveHist.shift();\n      }\n    }\n    drawWave();\n    requestAnimationFrame(waveLoop);\n  }\n  // ---- 真实脑电：Python 端已去直流基线，{\"eeg\":[微伏...]} 直接推入历史 ----\n  let realWave = false;\n  function pushRealEEG(arr){\n    realWave = true;\n    const maxN = Math.ceil(waveCv.width / 3) + 4;\n    for(const v of arr){\n      // 0µV = 中线 50，增益 0.35 → ±135µV 才到上下边，慢漂移不再把波形顶满全屏\n      waveHist.push(50 + Math.max(-47, Math.min(47, v * 0.35)));\n    }\n    while(waveHist.length > maxN) waveHist.shift();\n    const last = arr[arr.length-1];\n    $('signalBig').textContent = Math.round(last * 10) / 10;\n  }\n  requestAnimationFrame(waveLoop);\n\n  // ---- 窗口变化：尺寸随时同步（sizeGame 内部会按比例搬移飞船与管道） ----\n  let rzT = 0;\n  window.addEventListener('resize', function () {\n    clearTimeout(rzT);\n    rzT = setTimeout(function () {\n      sizeWave();\n      sizeGame();\n    }, 160);\n  });\n\n  updateThreshold(threshold);setSignal(12);\n})();\n  <\/script>\n\n  <!-- 星海背景：与首页 aurora-home 完全同一套渲染（斜向银河 + 分层星流 + 暗尘纹理） -->\n  <script>\n  (function () {\n    'use strict';\n    const TAU = Math.PI * 2;\n    const cv = document.getElementById('bgStars');\n    if (!cv) return;\n    const cx = cv.getContext('2d');\n\n    function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}\n    const rnd = mulberry32(20261106);\n    const rr = (a,b) => a + rnd()*(b-a);\n\n    // ---- 三套天空配色（与反馈页、实验室页统一：星海 / 极光 / 琥珀） ----\n    const SKY = {\n      galaxy: {\n        bg: ['#070c18', '#08101f', '#03050c'],\n        neb: [[70,112,190],[86,96,200],[46,82,150],[150,176,240],[246,222,184],[210,178,132]],\n        star: ['#ffffff','#ffffff','#ffffff','#f8fbff','#e9f0ff','#fff6e2','#f6dfb6','#e8c78d'],\n        core: [[255,250,236],[255,234,200],[150,185,255]]\n      },\n      aurora: {\n        bg: ['#05130f', '#061b18', '#020a08'],\n        neb: [[42,150,120],[56,186,150],[30,118,108],[168,242,214],[238,255,226],[196,238,168]],\n        star: ['#ffffff','#f6fffb','#e2fff2','#c8ffe6','#aef7d4','#f8ffe9','#e6ffd8','#cdf0b4'],\n        core: [[240,255,246],[198,255,226],[150,235,205]]\n      },\n      amber: {\n        bg: ['#150d07', '#1c1208', '#0b0603'],\n        neb: [[168,108,50],[198,140,72],[130,80,40],[250,218,168],[255,238,196],[236,190,120]],\n        star: ['#ffffff','#fffbf2','#fff3dd','#ffe8bd','#ffdba4','#fff6e4','#f9dfae','#f0c98a'],\n        core: [[255,250,236],[255,228,180],[235,178,116]]\n      }\n    };\n    let skyKey = LS.get('blinkSkySkin') || 'galaxy';\n    if (!SKY[skyKey]) skyKey = 'galaxy';\n    const LAYERS = [\n      { n: 1150, sp: 5.5, size: [0.45, 1.05], a: 0.62, near: 0 },\n      { n: 720,  sp: 14,  size: [0.6, 1.45],  a: 0.8,  near: 0.45 },\n      { n: 260,  sp: 30,  size: [0.9, 2.0],   a: 0.95, near: 1 }\n    ];\n    const BAND_STARS = 3400;\n    const GLOW_STARS = 26;\n\n    let stars = [], neb = null, W = 0, H = 0, DPR = 1, DIAG = 0, S = 0, R = 0;\n    let bgGrad = null, vigGrad = null;\n\n    function buildNebula() {\n      const SZ = 1000;\n      neb = document.createElement('canvas');\n      neb.width = SZ; neb.height = SZ;\n      const g = neb.getContext('2d');\n      const pal = SKY[skyKey].neb;\n      // 1) 星云絮状团：沿对角线(右上→左下)\n      g.globalCompositeOperation = 'lighter';\n      for (let i = 0; i < 300; i++) {\n        const u = rnd();\n        const along = -0.94 + u * 1.88;\n        const n = (rnd() + rnd() + rnd() - 1.5) * 0.185;\n        const x = SZ * 0.5 + (along * 0.707 - n * 0.707) * SZ * 1.05;\n        const y = SZ * 0.5 + (-along * 0.707 - n * 0.707) * SZ * 1.05;\n        const r = rr(SZ * 0.035, SZ * 0.10);\n        const c = pal[(rnd() * pal.length) | 0];\n        const a = rr(0.010, 0.030);\n        const rad = g.createRadialGradient(x, y, 0, x, y, r);\n        rad.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')');\n        rad.addColorStop(0.5, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a * 0.3) + ')');\n        rad.addColorStop(1, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)');\n        g.fillStyle = rad;\n        g.fillRect(x - r, y - r, r * 2, r * 2);\n      }\n      // 2) 银河乳白主带\n      for (let i = 0; i < 68; i++) {\n        const u = i / 67;\n        const along = -0.92 + u * 1.84;\n        const n = (rnd() + rnd() - 1) * 0.085;\n        const x = SZ * 0.5 + (along * 0.707 - n * 0.707) * SZ * 1.02;\n        const y = SZ * 0.5 + (-along * 0.707 - n * 0.707) * SZ * 1.02;\n        const r = rr(SZ * 0.055, SZ * 0.11);\n        const mid = Math.sin(u * Math.PI);\n        const a = rr(0.036, 0.072) * (0.35 + mid * 0.95);\n        const core = SKY[skyKey].core;\n        const rad = g.createRadialGradient(x, y, 0, x, y, r);\n        rad.addColorStop(0, 'rgba(' + core[0].join(',') + ',' + a + ')');\n        rad.addColorStop(0.35, 'rgba(' + core[1].join(',') + ',' + (a * 0.42) + ')');\n        rad.addColorStop(1, 'rgba(' + core[2].join(',') + ',0)');\n        g.fillStyle = rad;\n        g.fillRect(x - r, y - r, r * 2, r * 2);\n      }\n      // 3) 亮核：偏右上，暖白\n      const cg = g.createRadialGradient(SZ*0.66, SZ*0.34, 0, SZ*0.66, SZ*0.34, SZ*0.24);\n      const kc = SKY[skyKey].core;\n      cg.addColorStop(0, 'rgba(' + kc[0].join(',') + ',0.18)');\n      cg.addColorStop(0.18, 'rgba(' + kc[1].join(',') + ',0.13)');\n      cg.addColorStop(0.5, 'rgba(' + kc[2].join(',') + ',0.05)');\n      cg.addColorStop(1, 'rgba(' + kc[2].join(',') + ',0)');\n      g.fillStyle = cg;\n      g.fillRect(0, 0, SZ, SZ);\n      // 4) 暗尘带纹理\n      g.globalCompositeOperation = 'destination-out';\n      for (let i = 0; i < 74; i++) {\n        const u = rnd();\n        const along = -0.85 + u * 1.7;\n        const n = (rnd() - 0.5) * 0.15;\n        const x = SZ * 0.5 + (along * 0.707 - n * 0.707) * SZ * 1.02;\n        const y = SZ * 0.5 + (-along * 0.707 - n * 0.707) * SZ * 1.02;\n        const rx = rr(SZ * 0.02, SZ * 0.09);\n        const ry = rx * rr(0.18, 0.42);\n        g.save();\n        g.translate(x, y);\n        g.rotate(-Math.PI / 4 + rr(-0.25, 0.25));\n        const rad = g.createRadialGradient(0, 0, 0, 0, 0, rx);\n        rad.addColorStop(0, 'rgba(0,0,0,' + rr(0.10, 0.24) + ')');\n        rad.addColorStop(0.6, 'rgba(0,0,0,0.18)');\n        rad.addColorStop(1, 'rgba(0,0,0,0)');\n        g.fillStyle = rad;\n        g.beginPath();\n        g.ellipse(0, 0, rx, ry, 0, 0, TAU);\n        g.fill();\n        g.restore();\n      }\n    }\n\n    // 颜色索引：暖色（金）占约三成，其余冷白\n    const pickCi = () => (rnd() < 0.3 ? 6 + ((rnd() * 2) | 0) : (rnd() * 5) | 0);\n    function applyStarPalette() {\n      const pal = SKY[skyKey].star;\n      for (let i = 0; i < stars.length; i++) {\n        stars[i].col = pal[stars[i].ci % pal.length];\n      }\n    }\n\n    function buildStars() {\n      stars = [];\n      const dens = S < 720 ? 0.55 : 1;\n      for (let li = 0; li < LAYERS.length; li++) {\n        const L = LAYERS[li];\n        const ln = Math.round(L.n * dens);\n        for (let i = 0; i < ln; i++) {\n          stars.push({\n            x: rr(-R, R), y: rr(-R, R),\n            sp: L.sp * rr(0.72, 1.3),\n            sz: rr(L.size[0], L.size[1]),\n            a: L.a * rr(0.68, 1.0),\n            ci: pickCi(),\n            tw: rr(0.7, 2.8),\n            ph: rr(0, TAU),\n            near: L.near\n          });\n        }\n      }\n      // 银河带：沿斜线密集星尘\n      for (let i = 0; i < Math.round(BAND_STARS * dens); i++) {\n        const along = rr(-1, 1) * R * 0.98;\n        const perp = (rnd() + rnd() + rnd() - 1.5) * R * 0.062;\n        stars.push({\n          x: -0.707 * along + 0.707 * perp,\n          y: 0.707 * along + 0.707 * perp,\n          sp: rr(2.5, 11),\n          sz: rr(0.3, 0.98),\n          a: rr(0.32, 0.9),\n          ci: pickCi(),\n          tw: rr(0.6, 2.4),\n          ph: rr(0, TAU),\n          near: rnd() < 0.14 ? 1 : 0\n        });\n      }\n      // 银河带外缘羽化星尘\n      for (let i = 0; i < Math.round(1500 * dens); i++) {\n        const along = rr(-1, 1) * R * 0.98;\n        const perp = (rnd() + rnd() + rnd() - 1.5) * R * 0.24;\n        stars.push({\n          x: -0.707 * along + 0.707 * perp,\n          y: 0.707 * along + 0.707 * perp,\n          sp: rr(2, 9),\n          sz: rr(0.28, 0.7),\n          a: rr(0.10, 0.34),\n          ci: pickCi(),\n          tw: rr(0.6, 2.0),\n          ph: rr(0, TAU),\n          near: 0\n        });\n      }\n      // 少量带光晕的亮星\n      for (let i = 0; i < GLOW_STARS; i++) {\n        const along = rr(-1, 1) * R * 0.92;\n        const perp = (rnd() + rnd() + rnd() - 1.5) * R * 0.12;\n        stars.push({\n          x: -0.707 * along + 0.707 * perp,\n          y: 0.707 * along + 0.707 * perp,\n          sp: rr(3, 9),\n          sz: rr(1.2, 2.3),\n          a: rr(0.75, 1),\n          ci: rnd() < 0.72 ? 0 : 6,\n          tw: rr(0.5, 1.6),\n          ph: rr(0, TAU),\n          near: 0,\n          glow: true\n        });\n      }\n    }\n\n    function buildGradients() {\n      const bgc = SKY[skyKey].bg;\n      bgGrad = cx.createLinearGradient(0, 0, W * 0.35, H);\n      bgGrad.addColorStop(0, bgc[0]);\n      bgGrad.addColorStop(0.42, bgc[1]);\n      bgGrad.addColorStop(1, bgc[2]);\n      vigGrad = cx.createRadialGradient(W * 0.5, H * 0.48, S * 0.26, W * 0.5, H * 0.48, DIAG * 0.68);\n      vigGrad.addColorStop(0, 'rgba(2,4,10,0)');\n      vigGrad.addColorStop(0.62, 'rgba(2,4,10,0.14)');\n      vigGrad.addColorStop(1, 'rgba(1,2,6,0.6)');\n    }\n\n    function resize() {\n      DPR = Math.min(window.devicePixelRatio || 1, 2);\n      // 优先量游戏区 .pane-game 的可见尺寸：它是正常文档流，任何环境都能测准；\n      // 而 position:fixed 的 bgStars 和 window.innerWidth 在 iframe 未布局时都会是 0\n      const pane = document.querySelector('.pane-game');\n      const rect = (pane && pane.getBoundingClientRect()) || cv.getBoundingClientRect();\n      W = rect.width || window.innerWidth || document.documentElement.clientWidth || 0;\n      H = rect.height || window.innerHeight || document.documentElement.clientHeight || 0;\n      if (W < 2 || H < 2) return;   // 还没布局，等下次 resize 再量\n      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);\n      DIAG = Math.hypot(W, H);\n      S = Math.min(W, H);\n      R = DIAG * 0.86;\n      buildStars();\n      applyStarPalette();\n      buildGradients();\n    }\n\n    // 供皮肤面板调用：换天空配色（重建星云 + 底色 + 星点色板，几何数据不动）\n    window.__applySkySkin = function (key) {\n      if (!SKY[key]) return;\n      skyKey = key;\n      buildNebula();\n      buildGradients();\n      applyStarPalette();\n    };\n\n    let last = 0;\n    function frame(now) {\n      const dt = Math.min((now - last) / 1000 || 0.016, 0.05);\n      last = now;\n      const t = now / 1000;\n\n      cx.setTransform(DPR, 0, 0, DPR, 0, 0);\n      cx.globalCompositeOperation = 'source-over';\n      cx.fillStyle = bgGrad;\n      cx.fillRect(0, 0, W, H);\n\n      // 斜向银河\n      cx.globalCompositeOperation = 'lighter';\n      if (neb) {\n        const ns = (DIAG * 1.22) / neb.width;\n        cx.save();\n        cx.translate(W / 2, H / 2);\n        cx.scale(ns, ns);\n        cx.globalAlpha = 0.86;\n        cx.drawImage(neb, -neb.width / 2, -neb.height / 2);\n        cx.restore();\n        cx.globalAlpha = 1;\n      }\n\n      // 星流：沿右上→左下流动 + 闪烁\n      const Fx = -0.707, Fy = 0.707;\n      for (let i = 0; i < stars.length; i++) {\n        const s = stars[i];\n        const v = s.sp * dt * (0.35 + (s.near || 0) * 0.65);\n        s.x += Fx * v; s.y += Fy * v;\n        if (s.x < -60) { s.x += W + 120; s.y -= H + 120; }\n        if (s.y > H + 60) { s.x -= W + 120; s.y -= H + 120; }\n        const tw = 0.6 + 0.4 * Math.sin(t * s.tw + s.ph);\n        let a = s.a * (0.45 + tw * 0.65);\n        if (a <= 0.01) continue;\n        const px = ((s.x % (W + 120)) + W + 120) % (W + 120) - 60;\n        const py = ((s.y % (H + 120)) + H + 120) % (H + 120) - 60;\n\n        if (s.glow) {\n          const gr = s.sz * 4.2;\n          const g = cx.createRadialGradient(px, py, 0, px, py, gr);\n          g.addColorStop(0, 'rgba(255,255,255,' + (a * 0.85) + ')');\n          g.addColorStop(0.25, 'rgba(255,244,220,' + (a * 0.3) + ')');\n          g.addColorStop(1, 'rgba(255,240,210,0)');\n          cx.globalAlpha = 1;\n          cx.fillStyle = g;\n          cx.beginPath(); cx.arc(px, py, gr, 0, TAU); cx.fill();\n        }\n        cx.globalAlpha = Math.min(1, a);\n        cx.fillStyle = s.col;\n        if (s.sz < 0.85) {\n          cx.fillRect(px - 0.5, py - 0.5, 1.1, 1.1);\n        } else {\n          cx.beginPath(); cx.arc(px, py, s.sz * 0.62, 0, TAU); cx.fill();\n        }\n      }\n\n      // 暗角\n      cx.globalCompositeOperation = 'source-over';\n      cx.globalAlpha = 1;\n      cx.fillStyle = vigGrad;\n      cx.fillRect(0, 0, W, H);\n      requestAnimationFrame(frame);\n    }\n\n    buildNebula();\n    resize();\n    // iframe（单文件外壳）里首次 resize() 时窗口可能还是 0 或默认尺寸，\n    // 用 ResizeObserver + 短轮询兜底，布局稳定后重新量一次\n    if (window.ResizeObserver) {\n      new ResizeObserver(function () { resize(); }).observe(document.body);\n    }\n    [100, 400, 1000].forEach(function (ms) { setTimeout(resize, ms); });\n    // 若实验室面板存过背景皮肤，进来就按它渲染\n    try {\n      const savedSky = LS.get('blinkSkySkin');\n      if (savedSky && SKY[savedSky]) window.__applySkySkin(savedSky);\n    } catch (e) {}\n    let rzT = 0;\n    window.addEventListener('resize', function(){ clearTimeout(rzT); rzT = setTimeout(resize, 150); });\n    requestAnimationFrame(frame);\n  })();\n  <\/script>\n<script>\n/* nav.js —— 让同一套页面既能单独打开，也能装进单文件外壳的 iframe 里。\n *\n * 单独打开（window.parent === window）：链接正常跳转，什么都不做。\n * 在 iframe 里（单文件版外壳）：拦截页面内到其它页的链接，向父窗口发\n *   {nav: \"explore\"} 这样的消息，由外壳切换 iframe，避免整页重新加载。\n */\n(function () {\n  'use strict';\n\n  // 页面文件名 → 外壳里的 key。新增页面时在这里登记。\n  var MAP = {\n    'home.html': 'home',\n    'explore.html': 'explore',\n    'connect.html': 'connect',\n    'lab.html': 'lab'\n  };\n\n  var inFrame = false;\n  try { inFrame = window.parent && window.parent !== window; } catch (e) { inFrame = false; }\n  if (!inFrame) return;   // 单独打开：交给浏览器默认行为\n\n  function navigate(target) {\n    var key = MAP[target];\n    if (!key) return false;\n    parent.postMessage({ nav: key }, '*');\n    return true;\n  }\n\n  // 暴露给页面自己的 JS 用（如首页星图入口、游戏开始按钮）\n  window.auroraNav = navigate;\n  window.auroraInFrame = true;\n\n  // 捕获阶段拦截所有指向本组页面的 <a>\n  document.addEventListener('click', function (e) {\n    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n    if (!a) return;\n    var href = a.getAttribute('href') || '';\n    // 剥掉 query / hash，只比较文件名\n    var file = href.split('#')[0].split('?')[0].split('/').pop();\n    if (navigate(file)) e.preventDefault();\n  }, true);\n})();\n\n<\/script>\n\n<\/body>\n<\/html>\n"
};

var ORDER = ["home", "explore", "connect", "lab"];
var FMAP = {"home.html": "home", "explore.html": "explore", "connect.html": "connect", "lab.html": "lab"};

function show(k){
  var fr=document.querySelectorAll("iframe");
  for(var i=0;i<fr.length;i++)fr[i].classList.remove("on");
  var f=document.getElementById("pg-"+k);
  if(!f){
    f=document.createElement("iframe");
    f.id="pg-"+k;
    f.setAttribute("allow","autoplay");
    f.srcdoc=PAGES[k];
    document.body.appendChild(f);
  }
  f.classList.add("on");
  current=k;
}
function route(){
  var k=(location.hash||"#home").slice(1);
  if(ORDER.indexOf(k)<0)k="home";
  show(k);
}
window.addEventListener("hashchange",route);

window.addEventListener("message",function(e){
  var d=e.data||{};
  // 只接受来自当前实验室 iframe 的消息
  var lab=labFrame();
  if(lab && e.source!==lab.contentWindow) return;

  var nav=d.nav;
  if(nav){
    nav=FMAP[nav]||nav;
    if(ORDER.indexOf(nav)>=0&&location.hash!=="#"+nav)location.hash=nav;
    return;
  }
  // 实验室 iframe 无法直连本机 WebSocket（浏览器本地网络限制），由外壳代连并转发
  if(d.wsCmd==="open"){relayOpen(d.url);}
  else if(d.wsCmd==="close"){relayClose();}
});

var current=null,wsConn=null,wsLastMsg=0,wsWatch=null;
function labFrame(){return document.getElementById("pg-lab");}
function postLab(o){var f=labFrame();if(f&&f.contentWindow)f.contentWindow.postMessage(o,"*");}

function relayOpen(url){
  // 重连前先收掉旧的心跳定时器，否则每重连一次就多一条 interval 常驻
  if(wsWatch){clearInterval(wsWatch);wsWatch=null;}
  try{
    if(wsConn&&wsConn.readyState<=1){try{wsConn.close();}catch(e){}}
    wsLastMsg=0;
    wsConn=new WebSocket(url||"ws://127.0.0.1:7000");
    wsConn.onopen=function(){wsLastMsg=Date.now();postLab({wsState:"open"});};
    wsConn.onerror=function(){postLab({wsState:"error"});};
    wsConn.onclose=function(){postLab({wsState:"close"});};
    wsConn.onmessage=function(ev){wsLastMsg=Date.now();postLab({wsData:ev.data});};
    // 心跳看门狗：曾经收到过数据、现在超过 9 秒静默 → 连接已半死，主动断开触发重连
    wsWatch=setInterval(function(){
      if(!wsConn)return;
      if(wsConn.readyState===1&&wsLastMsg&&Date.now()-wsLastMsg>9000){
        try{wsConn.close();}catch(e){}
      }
    },2500);
  }catch(err){postLab({wsState:"error"});}
}

function relayClose(){
  if(wsWatch){clearInterval(wsWatch);wsWatch=null;}
  try{if(wsConn)wsConn.close();}catch(e){}
  wsConn=null;wsLastMsg=0;
}

route();

</script>

"home":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\n<title>AURORA · 星海实验室<\/title>\n<style>\n  *{margin:0;padding:0;box-sizing:border-box;}\n  html,body{height:100%;background:#02040a;overflow:hidden;}\n  body{\n    font-family:\"Helvetica Neue\",-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n    color:#eef3ff;-webkit-font-smoothing:antialiased;\n    cursor:default;\n  }\n  #sky{position:fixed;inset:0;display:block;touch-action:none;}\n\n  .hud{position:fixed;inset:0;pointer-events:none;z-index:3;}\n\n  /* 左上品牌 */\n  .brand{position:absolute;left:clamp(22px,3.4vw,46px);top:clamp(22px,3.4vw,40px);}\n  .brand .mark{display:flex;align-items:center;gap:10px;}\n  .brand .dot{\n    width:7px;height:7px;border-radius:50%;background:#fff;\n    box-shadow:0 0 10px 2px rgba(255,238,205,.9),0 0 26px 8px rgba(226,190,126,.35);\n    animation:breathe 4s ease-in-out infinite;\n  }\n  @keyframes breathe{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}\n  .brand h1{\n    font-size:13px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;\n    color:#f8f4e9;text-shadow:0 0 18px rgba(255,236,198,.45);\n  }\n  .brand p{\n    margin-top:9px;font-size:11px;letter-spacing:.2em;color:rgba(214,226,248,.55);\n    padding-left:17px;\n  }\n\n  .scroll::after{\n    content:\"\";position:absolute;left:0;top:-40%;width:1px;height:40%;\n    background:linear-gradient(to bottom,rgba(255,240,210,0),#fff3d8);\n    animation:drop 2.6s cubic-bezier(.6,.05,.4,.95) infinite;\n  }\n  @keyframes drop{0%{top:-45%}70%{top:100%}100%{top:100%}}\n\n  /* 三个入口标注 */\n  .hub{\n    position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;\n    transform:translate(-50%,-50%);white-space:nowrap;text-align:center;\n    padding:6px 10px;transition:opacity .45s ease;\n    will-change:transform;\n    filter:drop-shadow(0 2px 8px rgba(0,0,0,.85));\n  }\n  .hub b{\n    display:block;font-size:12px;font-weight:500;letter-spacing:.3em;\n    color:#fffaef;\n    text-shadow:0 1px 6px rgba(0,0,0,.95),0 0 16px rgba(255,238,202,.55);\n    transition:color .3s,text-shadow .3s,letter-spacing .3s;\n  }\n  .hub span{\n    display:block;margin-top:5px;font-size:11px;letter-spacing:.18em;\n    color:rgba(238,205,150,.92);\n    text-shadow:0 1px 6px rgba(0,0,0,.95);\n    transition:color .3s;\n  }\n  .hub:hover b,.hub.on b{\n    color:#fff;letter-spacing:.34em;\n    text-shadow:0 0 10px rgba(255,255,255,.95),0 0 28px rgba(255,226,168,.8);\n  }\n  .hub:hover span,.hub.on span{color:#f6d9a4;}\n\n  /* toast */\n  #toast{\n    position:fixed;left:50%;bottom:clamp(90px,13vh,150px);transform:translate(-50%,14px);\n    padding:11px 22px;border-radius:999px;\n    background:rgba(10,16,30,.72);border:1px solid rgba(240,214,164,.28);\n    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);\n    font-size:12px;letter-spacing:.14em;color:#f6e7c8;\n    opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:6;\n    box-shadow:0 8px 40px rgba(0,0,0,.6),0 0 30px rgba(226,190,126,.12) inset;\n  }\n  #toast.show{opacity:1;transform:translate(-50%,0);}\n\n  /* 跳转过渡：星光收拢 → 融入黑暗 */\n  #warp{\n    position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;\n    background:radial-gradient(ellipse at 50% 46%,rgba(255,240,210,.10),rgba(2,4,10,.86) 62%,rgba(1,2,6,.98));\n    transition:opacity .55s ease;\n  }\n  #warp.show{opacity:1;}\n\n  @media (max-width:640px){\n    .brand p{display:none}\n    .hub b{font-size:10px;letter-spacing:.24em}\n    .hub span{font-size:10px}\n  }\n<\/style>\n<\/head>\n<body>\n<canvas id=\"sky\"><\/canvas>\n<div class=\"hud\" id=\"hud\">\n  <div class=\"brand\">\n    <div class=\"mark\"><i class=\"dot\"><\/i><h1>Aurora Voyage<\/h1><\/div>\n    <p>星海航行计划 · 以一次眨眼启航<\/p>\n  <\/div>\n<\/div>\n<div id=\"toast\"><\/div>\n<div id=\"warp\"><\/div>\n\n<script>\n(function () {\n  'use strict';\n\n  /* ---------------- 基础工具 ---------------- */\n  const TAU = Math.PI * 2;\n  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);\n  const lerp = (a, b, t) => a + (b - a) * t;\n\n  // 固定种子：构图每次打开都一样\n  function mulberry32(a) {\n    return function () {\n      a |= 0; a = (a + 0x6D2B79F5) | 0;\n      let t = Math.imul(a ^ (a >>> 15), 1 | a);\n      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n  }\n  const rnd = mulberry32(20261106);\n  const rr = (a, b) => a + rnd() * (b - a);\n\n  /* ---------------- DOM ---------------- */\n  const canvas = document.getElementById('sky');\n  const ctx = canvas.getContext('2d', { alpha: false });\n  const hudEl = document.getElementById('hud');\n  const toastEl = document.getElementById('toast');\n\n  /* ---------------- 全局状态 ---------------- */\n  let W = 0, H = 0, DPR = 1, DIAG = 0, S = 0, R = 0;\n  let stars = [];\n  let neb = null;\n  let bgGrad = null, vigGrad = null, bottomGrad = null;\n\n  // 视角\n  let panX = 0, panY = 0, vx = 0, vy = 0;\n  let rot = 0, rotVel = 0;\n  let rotY = 0, rotYVel = 0;   // 3D 偏航：双指左右滑\n  let rotX = 0, rotXVel = 0;   // 3D 俯仰：双指上下滑\n  let zoom = 1, tZoom = 1;\n\n  // 能量：拖动时更亮\n  let energy = 0.12, tEnergy = 0.12;\n\n  // 指针\n  const pointer = { x: -999, y: -999, in: false, down: false, moved: 0 };\n  const ptrs = new Map();\n  let pinchStart = 0, pinchZoom = 1;\n  let midLX = 0, midLY = 0;    // 双指中点（旋转手势）\n  let hoverIdx = -1;\n\n  let ripples = [];\n  let trail = [];              // 流光拖尾（悬浮 + 拖动）\n  let time = 0;\n  let lastT = 0;\n\n  // 流光补点：沿轨迹等距插值，避免快速移动出现断珠\n  function pushTrail(x, y, hov) {\n    const tp = trail.length ? trail[trail.length - 1] : null;\n    if (!tp) {\n      trail.push({ x: x, y: y, life: 1, hov: hov });\n    } else {\n      const gx = x - tp.x, gy = y - tp.y;\n      const dist = Math.hypot(gx, gy);\n      if (dist >= 3) {\n        const n = Math.min(26, Math.round(dist / 3));\n        for (let k = 1; k <= n; k++) {\n          trail.push({ x: tp.x + gx * (k / n), y: tp.y + gy * (k / n), life: 1, hov: hov });\n        }\n      } else if (dist > 1.2) {\n        trail.push({ x: x, y: y, life: 1, hov: hov });\n      }\n    }\n    while (trail.length > 70) trail.shift();\n  }\n\n  // 星流方向：右上 → 左下\n  const FLOW = { x: -0.882, y: 0.471 };\n\n  // 三个功能入口（世界坐标按屏幕短边比例摆放，沿星流斜线分布）\n  // url 填本地同目录文件名或完整网址；留空 = 入口建设中\n  const HUBS = [\n    { id: 'explore', title: 'EXPLORE', cn: '沉浸浏览', fx: 0.30, fy: -0.28, fz: 0.34, dx: 0, dy: 78, ph: 0.0, url: 'explore.html' },\n    { id: 'lab', title: 'LAB', cn: '脑波实验室', fx: -0.02, fy: 0.07, fz: -0.05, dx: 0, dy: 82, ph: 2.1, url: 'lab.html' },\n    { id: 'connect', title: 'CONNECT', cn: '关于与反馈', fx: -0.33, fy: 0.30, fz: -0.34, dx: 0, dy: -72, ph: 4.0, url: 'connect.html' }\n  ];\n  const LINKS = [[0, 1], [1, 2], [2, 0]];\n\n  const STAR_COLORS = [\n    '#ffffff', '#ffffff', '#ffffff', '#f8fbff',\n    '#e9f0ff', '#fff6e2', '#f6dfb6', '#e8c78d'\n  ];\n\n  const LAYERS = [\n    { n: 1150, sp: 5.5, size: [0.45, 1.05], a: 0.62, near: 0 },\n    { n: 720, sp: 14, size: [0.6, 1.45], a: 0.8, near: 0.45 },\n    { n: 260, sp: 30, size: [0.9, 2.0], a: 0.95, near: 1 }\n  ];\n  const BAND_STARS = 3400;\n  const GLOW_STARS = 26;\n\n  /* ---------------- 尺寸 ---------------- */\n  function resize() {\n    DPR = Math.min(window.devicePixelRatio || 1, 2);\n    W = window.innerWidth;\n    H = window.innerHeight;\n    canvas.width = Math.round(W * DPR);\n    canvas.height = Math.round(H * DPR);\n    canvas.style.width = W + 'px';\n    canvas.style.height = H + 'px';\n    DIAG = Math.hypot(W, H);\n    S = Math.min(W, H);\n    R = DIAG * 0.86;\n\n    buildStars();\n    buildNebula();\n    placeHubs();\n    buildGradients();\n  }\n\n  function buildStars() {\n    stars = [];\n    // 小屏降低密度，保证帧率\n    const dens = S < 720 ? 0.55 : 1;\n    for (let li = 0; li < LAYERS.length; li++) {\n      const L = LAYERS[li];\n      const ln = Math.round(L.n * dens);\n      for (let i = 0; i < ln; i++) {\n        stars.push({\n          x: rr(-R, R),\n          y: rr(-R, R),\n          sp: L.sp * rr(0.72, 1.3),\n          sz: rr(L.size[0], L.size[1]),\n          a: L.a * rr(0.68, 1.0),\n          col: STAR_COLORS[(rnd() * STAR_COLORS.length) | 0],\n          tw: rr(0.7, 2.8),\n          ph: rr(0, TAU),\n          near: L.near\n        });\n      }\n    }\n\n    // 银河带：沿右上→左下这条斜线密集铺一层细碎星尘\n    for (let i = 0; i < Math.round(BAND_STARS * dens); i++) {\n      const along = rr(-1, 1) * R * 0.98;\n      const perp = (rnd() + rnd() + rnd() - 1.5) * R * 0.062;\n      stars.push({\n        x: -0.707 * along + 0.707 * perp,\n        y: 0.707 * along + 0.707 * perp,\n        sp: rr(2.5, 11),\n        sz: rr(0.3, 0.98),\n        a: rr(0.32, 0.9),\n        col: rnd() < 0.22 ? '#ffeecd' : STAR_COLORS[(rnd() * 4) | 0],\n        tw: rr(0.6, 2.4),\n        ph: rr(0, TAU),\n        near: rnd() < 0.14 ? 1 : 0\n      });\n    }\n\n    // 银河带外缘：稀疏一层羽化星尘，让带的边缘自然过渡\n    for (let i = 0; i < Math.round(1500 * dens); i++) {\n      const along = rr(-1, 1) * R * 0.98;\n      const perp = (rnd() + rnd() + rnd() - 1.5) * R * 0.24;\n      stars.push({\n        x: -0.707 * along + 0.707 * perp,\n        y: 0.707 * along + 0.707 * perp,\n        sp: rr(2, 9),\n        sz: rr(0.28, 0.7),\n        a: rr(0.10, 0.34),\n        col: STAR_COLORS[(rnd() * 4) | 0],\n        tw: rr(0.6, 2.0),\n        ph: rr(0, TAU),\n        near: 0\n      });\n    }\n\n    // 少量带光晕的亮星，制造\"闪\"的层次\n    for (let i = 0; i < GLOW_STARS; i++) {\n      const along = rr(-1, 1) * R * 0.92;\n      const perp = (rnd() + rnd() + rnd() - 1.5) * R * 0.12;\n      stars.push({\n        x: -0.707 * along + 0.707 * perp,\n        y: 0.707 * along + 0.707 * perp,\n        sp: rr(3, 9),\n        sz: rr(1.2, 2.3),\n        a: rr(0.75, 1),\n        col: rnd() < 0.72 ? '#ffffff' : '#ffeecd',\n        tw: rr(0.5, 1.6),\n        ph: rr(0, TAU),\n        near: 0,\n        glow: true\n      });\n    }\n\n    // 深度：每颗星一个固定 z，并按透视预补偿位置——\n    // 静止时画面与原设计一致，旋转时星点才真正前后错动\n    for (let i = 0; i < stars.length; i++) {\n      const s = stars[i];\n      const span = s.glow ? 0.30 : (s.near > 0.8 ? 0.34 : 0.26);\n      s.z = rr(-span, span) * S;\n      const persp0 = (S * 2.4) / (S * 2.4 - s.z);\n      s.x /= persp0;\n      s.y /= persp0;\n    }\n  }\n\n  /* ---------------- 星云底图（离屏预渲染） ---------------- */\n  function buildNebula() {\n    const SZ = 1000;\n    neb = document.createElement('canvas');\n    neb.width = SZ; neb.height = SZ;\n    const g = neb.getContext('2d');\n\n    const pal = [\n      [70, 112, 190], [86, 96, 200], [46, 82, 150],\n      [150, 176, 240], [246, 222, 184], [210, 178, 132]\n    ];\n\n    // 1) 星云絮状团：沿对角线(右上→左下)，横向窄、纵向密\n    g.globalCompositeOperation = 'lighter';\n    for (let i = 0; i < 300; i++) {\n      const u = rnd();\n      const along = -0.94 + u * 1.88;                    // 覆盖整条银河带（端点自然羽化）\n      const n = (rnd() + rnd() + rnd() - 1.5) * 0.185;    // 横向抖动\n      const x = SZ * 0.5 + (along * 0.707 - n * 0.707) * SZ * 1.05;\n      const y = SZ * 0.5 + (-along * 0.707 - n * 0.707) * SZ * 1.05;\n      const r = rr(SZ * 0.035, SZ * 0.10);\n      const c = pal[(rnd() * pal.length) | 0];\n      const a = rr(0.010, 0.030);\n      const rad = g.createRadialGradient(x, y, 0, x, y, r);\n      rad.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')');\n      rad.addColorStop(0.5, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a * 0.3) + ')');\n      rad.addColorStop(1, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)');\n      g.fillStyle = rad;\n      g.fillRect(x - r, y - r, r * 2, r * 2);\n    }\n\n    // 2) 银河乳白主带：一条被压窄的柔光脊\n    for (let i = 0; i < 68; i++) {\n      const u = i / 67;\n      const along = -0.92 + u * 1.84;\n      const n = (rnd() + rnd() - 1) * 0.085;\n      const x = SZ * 0.5 + (along * 0.707 - n * 0.707) * SZ * 1.02;\n      const y = SZ * 0.5 + (-along * 0.707 - n * 0.707) * SZ * 1.02;\n      const r = rr(SZ * 0.055, SZ * 0.11);\n      const mid = Math.sin(u * Math.PI);\n      const a = rr(0.036, 0.072) * (0.35 + mid * 0.95);\n      const rad = g.createRadialGradient(x, y, 0, x, y, r);\n      rad.addColorStop(0, 'rgba(255,250,238,' + a + ')');\n      rad.addColorStop(0.35, 'rgba(214,228,255,' + (a * 0.42) + ')');\n      rad.addColorStop(1, 'rgba(150,180,255,0)');\n      g.fillStyle = rad;\n      g.fillRect(x - r, y - r, r * 2, r * 2);\n    }\n\n    // 3) 亮核：偏右上角，暖白\n    const cx = SZ * 0.66, cy = SZ * 0.34;\n    const cg = g.createRadialGradient(cx, cy, 0, cx, cy, SZ * 0.24);\n    cg.addColorStop(0, 'rgba(255,250,236,0.18)');\n    cg.addColorStop(0.18, 'rgba(255,234,200,0.13)');\n    cg.addColorStop(0.5, 'rgba(150,185,255,0.05)');\n    cg.addColorStop(1, 'rgba(110,145,235,0)');\n    g.fillStyle = cg;\n    g.fillRect(0, 0, SZ, SZ);\n\n    // 4) 暗尘带：把光带\"挖\"出纹理，模拟银河暗礁\n    g.globalCompositeOperation = 'destination-out';\n    for (let i = 0; i < 74; i++) {\n      const u = rnd();\n      const along = -0.85 + u * 1.7;\n      const n = (rnd() - 0.5) * 0.15;\n      const x = SZ * 0.5 + (along * 0.707 - n * 0.707) * SZ * 1.02;\n      const y = SZ * 0.5 + (-along * 0.707 - n * 0.707) * SZ * 1.02;\n      const rx = rr(SZ * 0.02, SZ * 0.09);\n      const ry = rx * rr(0.18, 0.42);\n      g.save();\n      g.translate(x, y);\n      g.rotate(-Math.PI / 4 + rr(-0.25, 0.25));\n      const rad = g.createRadialGradient(0, 0, 0, 0, 0, rx);\n      rad.addColorStop(0, 'rgba(0,0,0,' + rr(0.10, 0.24) + ')');\n      rad.addColorStop(0.6, 'rgba(0,0,0,0.18)');\n      rad.addColorStop(1, 'rgba(0,0,0,0)');\n      g.fillStyle = rad;\n      g.beginPath();\n      g.ellipse(0, 0, rx, ry, 0, 0, TAU);\n      g.fill();\n      g.restore();\n    }\n  }\n\n  function buildGradients() {\n    bgGrad = ctx.createLinearGradient(0, 0, W * 0.35, H);\n    bgGrad.addColorStop(0, '#070c18');\n    bgGrad.addColorStop(0.42, '#08101f');\n    bgGrad.addColorStop(1, '#03050c');\n\n    vigGrad = ctx.createRadialGradient(W * 0.5, H * 0.48, S * 0.26, W * 0.5, H * 0.48, DIAG * 0.68);\n    vigGrad.addColorStop(0, 'rgba(2,4,10,0)');\n    vigGrad.addColorStop(0.62, 'rgba(2,4,10,0.14)');\n    vigGrad.addColorStop(1, 'rgba(1,2,6,0.6)');\n\n    bottomGrad = ctx.createLinearGradient(0, H * 0.7, 0, H);\n    bottomGrad.addColorStop(0, 'rgba(2,4,10,0)');\n    bottomGrad.addColorStop(1, 'rgba(2,4,10,0.6)');\n  }\n\n  function placeHubs() {\n    // 窄屏收缩横向间距，避免标注贴边\n    const spread = W < 620 ? 0.7 : 1;\n    HUBS.forEach(function (h) {\n      h.wz = h.fz * S;\n      // 透视预补偿：静止时三颗光点的位置与大小和原设计完全一致\n      const persp0 = (S * 2.4) / (S * 2.4 - h.wz);\n      h.wx = h.fx * S * 1.06 * spread / persp0;\n      h.wy = h.fy * S * 1.06 / persp0;\n      h.r = S * 0.021 / persp0;\n    });\n  }\n\n  /* ---------------- 标注 DOM ---------------- */\n  function buildHubLabels() {\n    HUBS.forEach(function (h) {\n      const el = document.createElement('div');\n      el.className = 'hub';\n      el.innerHTML = '<b>' + h.title + '<\/b><span>' + h.cn + '<\/span>';\n      el.addEventListener('click', function (e) {\n        e.stopPropagation();\n        triggerHub(h);\n      });\n      hudEl.appendChild(el);\n      h.el = el;\n    });\n  }\n\n  /* ---------------- 投影（2D 自转 + 3D 偏航/俯仰 + 透视） ---------------- */\n  function project(x, y, z) {\n    z = z || 0;\n    // 2D 自转（拖动）\n    const cr = Math.cos(rot), sr = Math.sin(rot);\n    let X = x * cr - y * sr;\n    let Y = x * sr + y * cr;\n    // 3D 偏航（绕竖轴）\n    const cy = Math.cos(rotY), sy = Math.sin(rotY);\n    let Z = X * sy + z * cy;\n    X = X * cy - z * sy;\n    // 3D 俯仰（绕横轴）\n    const cxr = Math.cos(rotX), sxr = Math.sin(rotX);\n    const Y2 = Y * cxr - Z * sxr;\n    Z = Y * sxr + Z * cxr;\n    Y = Y2;\n    const f = S * 2.4;\n    let d = f - Z;\n    if (d < f * 0.10) d = f * 0.10;          // 相机近平面：自由旋转时防止贴脸爆炸\n    const persp = Math.min(2.6, Math.max(0.4, f / d));\n    return [\n      W / 2 + panX + X * persp * zoom,\n      H / 2 + panY > 0.5) tEnergy = Math.max(tEnergy, 0.5);\n        }\n        midLX = mx; midLY = my;\n        return;\n      }\n\n      if (pointer.down) {\n        const dx = e.clientX - pointer.lx;\n        const dy = e.clientY - pointer.ly;\n        pointer.lx = e.clientX;\n        pointer.ly = e.clientY;\n        pointer.moved += Math.abs(dx) + Math.abs(dy);\n\n        panX += dx;\n        panY += dy;\n        vx = dx * 0.9;\n        vy = dy * 0.9;\n        rotVel += dx * 0.00055;\n        tEnergy = 1;\n      }\n    });\n\n    function endPointer(e) {\n      ptrs.delete(e.pointerId);\n      if (ptrs.size < 2) { pinchStart = 0; midLX = 0; midLY = 0; }\n      if (ptrs.size === 0) {\n        pointer.down = false;\n        tEnergy = 0.16;\n      }\n    }\n    canvas.addEventListener('pointerup', endPointer);\n    canvas.addEventListener('pointercancel', endPointer);\n    canvas.addEventListener('pointerleave', function () {\n      pointer.in = false;\n      pointer.x = -999; pointer.y = -999;\n    });\n\n    canvas.addEventListener('wheel', function (e) {\n      e.preventDefault();\n      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {\n        // 触控板横向双指滑动 → 3D 偏航（可一直转到任意角度）\n        rotYVel += e.deltaX * 0.0021;\n        tEnergy = Math.max(tEnergy, 0.45);\n      } else {\n        tZoom = clamp(tZoom * (1 - e.deltaY * 0.0012), 0.62, 2.2);\n      }\n    }, { passive: false });\n\n    canvas.addEventListener('click', function (e) {\n      if (pointer.moved > 8) return;\n      const i = pickHub(e.clientX, e.clientY);\n      if (i >= 0) triggerHub(HUBS[i]);\n    });\n\n    window.addEventListener('resize', function () {\n      clearTimeout(window.__rzTimer);\n      window.__rzTimer = setTimeout(resize, 120);\n    });\n\n    document.addEventListener('visibilitychange', function () {\n      lastT = performance.now();\n      if (!document.hidden) { document.getElementById('warp').classList.remove('show'); }\n    });\n  }\n\n  /* ---------------- 入口点击 ---------------- */\n  function triggerHub(h) {\n    ripples.push({ x: h.wx, y: h.wy, z: h.wz, r: h.r * 0.6, life: 1 });\n    energy = Math.max(energy, 0.85);\n    tEnergy = 1;\n\n    if (h.url) {\n      showToast('正在进入 ' + h.title + ' · ' + h.cn);\n      document.getElementById('warp').classList.add('show');\n      setTimeout(function () {\n        // 在单文件外壳的 iframe 里 → 交给 nav.js 切页；单独打开 → 直接跳转\n        if (!(window.auroraNav && window.auroraNav(h.url))) location.href = h.url;\n        setTimeout(function () { document.getElementById('warp').classList.remove('show'); }, 700);\n      }, 560);\n    } else {\n      showToast(h.title + ' · ' + h.cn + ' — 入口建设中，敬请期待');\n    }\n    // 外部自定义路由：window.onHubClick = function(id, hub) {...}\n    if (typeof window.onHubClick === 'function') {\n      window.onHubClick(h.id, h);\n    }\n  }\n\n  let toastTimer = 0;\n  function showToast(text) {\n    toastEl.textContent = text;\n    toastEl.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () {\n      toastEl.classList.remove('show');\n    }, 2000);\n  }\n\n  /* ---------------- 更新 ---------------- */\n  function update(dt) {\n    energy += (tEnergy - energy) * Math.min(1, dt * 2.4);\n    if (!pointer.down) tEnergy += (0.16 - tEnergy) * Math.min(1, dt * 0.9);\n\n    zoom += (tZoom - zoom) * Math.min(1, dt * 6);\n\n    // 惯性\n    if (!pointer.down) {\n      panX += vx * dt * 6;\n      panY += vy * dt * 6;\n      const damp = Math.pow(0.0025, dt);\n      vx *= damp; vy *= damp;\n    }\n    rot += rotVel * dt * 6;\n    rotVel *= Math.pow(0.0025, dt);\n    // 闲置时缓慢回正：拖动后有惯性，但松手会回到标准构图，保证三个入口不跑出画面\n    if (!pointer.down) rot += (0 - rot) * Math.min(1, dt * 0.18);\n\n    // 3D 旋转：偏航 360° 自由转、可带惯性连转；俯仰限 ±66° 防止天地颠倒\n    rotY += rotYVel * dt * 6;\n    rotYVel *= Math.pow(0.10, dt);\n    rotX += rotXVel * dt * 6;\n    rotXVel *= Math.pow(0.10, dt);\n    rotX = clamp(rotX, -1.15, 1.15);\n\n    // 拖尾衰减\n    for (let i = trail.length - 1; i >= 0; i--) {\n      trail[i].life -= dt * 1.5;\n      if (trail[i].life <= 0) trail.splice(i, 1);\n    }\n\n    const limit = S * 0.42;\n    panX = clamp(panX, -limit, limit);\n    panY = clamp(panY, -limit, limit);\n\n    // 星流\n    const boost = 1 + energy * 1.15;\n    for (let i = 0; i < stars.length; i++) {\n      const s = stars[i];\n      s.x += FLOW.x * s.sp * boost * dt;\n      s.y += FLOW.y * s.sp * boost * dt;\n      if (s.x < -R) s.x += R * 2;\n      if (s.y > R) s.y -= R * 2;\n    }\n\n    for (let i = ripples.length - 1; i >= 0; i--) {\n      const rp = ripples[i];\n      rp.r += (S * 0.9 - rp.r) * Math.min(1, dt * 2.2);\n      rp.life -= dt * 0.85;\n      if (rp.life <= 0) ripples.splice(i, 1);\n    }\n  }\n\n  /* ---------------- 绘制 ---------------- */\n  function worldTransform(par) {\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    ctx.translate(W / 2 + panX * par, H / 2 + panY * par);\n    ctx.rotate(rot * par);\n    ctx.scale(zoom, zoom);\n  }\n\n  function drawBackground(t) {\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    ctx.globalCompositeOperation = 'source-over';\n    ctx.fillStyle = bgGrad;\n    ctx.fillRect(0, 0, W, H);\n\n    // 星云：随 3D 旋转轻微呼吸式压扁（不用 cos，避免转到 90° 被压成一条亮线）\n    ctx.globalCompositeOperation = 'lighter';\n    worldTransform(0.45);\n    const sqX = 1 - 0.28 * Math.abs(Math.sin(rotY * 0.5));\n    const sqY = 1 - 0.16 * Math.abs(Math.sin(rotX * 0.5));\n    const ns = (DIAG * 1.24) / neb.width;\n    ctx.scale(ns * sqX, ns * sqY);\n    ctx.globalAlpha = 0.62 + energy * 0.3;\n    ctx.drawImage(neb, -neb.width / 2, -neb.height / 2);\n    ctx.globalAlpha = 1;\n  }\n\n  function drawStars(t) {\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.lineCap = 'round';\n\n    const boost = 1 + energy * 0.55;\n\n    for (let i = 0; i < stars.length; i++) {\n      const s = stars[i];\n      const p = project(s.x, s.y, s.z);\n      const px = p[0], py = p[1], ps = p[2] * zoom;\n      if (px < -90 || px > W + 90 || py < -90 || py > H + 90) continue;\n\n      const tw = 0.62 + 0.38 * Math.sin(t * s.tw + s.ph);\n      let a = s.a * (0.55 + tw * 0.6) * boost * Math.min(1.1, Math.max(0.55, ps));\n      if (a <= 0.012) continue;\n\n      const sz = s.sz * ps;\n\n      // 亮星：柔和光晕 + 十字星芒\n      if (s.glow) {\n        const gr = sz * 8;\n        const g2 = ctx.createRadialGradient(px, py, 0, px, py, gr);\n        g2.addColorStop(0, 'rgba(255,255,255,' + Math.min(1, a * 1.1) + ')');\n        g2.addColorStop(0.10, 'rgba(255,252,240,' + Math.min(1, a * 0.9) + ')');\n        g2.addColorStop(0.30, 'rgba(255,238,204,' + (a * 0.20) + ')');\n        g2.addColorStop(1, 'rgba(255,226,180,0)');\n        ctx.globalAlpha = 1;\n        ctx.fillStyle = g2;\n        ctx.beginPath();\n        ctx.arc(px, py, gr, 0, TAU);\n        ctx.fill();\n\n        const L = gr * 1.05;\n        ctx.globalAlpha = Math.min(0.45, a * 0.4);\n        ctx.strokeStyle = '#fff8ec';\n        ctx.lineWidth = 0.7;\n        ctx.beginPath();\n        ctx.moveTo(px - L, py); ctx.lineTo(px + L, py);\n        ctx.moveTo(px, py - L * 0.85); ctx.lineTo(px, py + L * 0.85);\n        ctx.stroke();\n        continue;\n      }\n\n      // 近处星点带拖尾（方向随投影变化，旋转时仍然正确）\n      if (s.near > 0.8) {\n        const len = 2.5 + s.sp * 0.55 * (0.7 + energy * 1.0);\n        const pe = project(s.x - FLOW.x * len, s.y - FLOW.y * len, s.z);\n        ctx.globalAlpha = Math.min(0.8, a * 0.5);\n        ctx.strokeStyle = s.col;\n        ctx.lineWidth = Math.max(0.6, sz * 0.55);\n        ctx.beginPath();\n        ctx.moveTo(px, py);\n        ctx.lineTo(pe[0], pe[1]);\n        ctx.stroke();\n      }\n\n      ctx.globalAlpha = Math.min(1, a * 1.15);\n      ctx.fillStyle = s.col;\n\n      if (sz < 0.85) {\n        // 极小星点画成 1px 硬点，比缩放矩形更\"锐\"\n        ctx.fillRect(px - 0.55, py - 0.55, 1.1, 1.1);\n      } else {\n        ctx.beginPath();\n        ctx.arc(px, py, sz * 0.62, 0, TAU);\n        ctx.fill();\n        // 亮星十字星芒\n        if (sz > 1.5) {\n          const l = sz * 6.5;\n          ctx.globalAlpha = Math.min(0.5, a * 0.45);\n          ctx.strokeStyle = s.col;\n          ctx.lineWidth = 0.7;\n          ctx.beginPath();\n          ctx.moveTo(px - l, py); ctx.lineTo(px + l, py);\n          ctx.moveTo(px, py - l); ctx.lineTo(px, py + l);\n          ctx.stroke();\n        }\n      }\n    }\n    ctx.globalAlpha = 1;\n  }\n\n  // 贝塞尔取样\n  function qpt(ax, ay, cx, cy, bx, by, t) {\n    const it = 1 - t;\n    return [\n      it * it * ax + 2 * it * t * cx + t * t * bx,\n      it * it * ay + 2 * it * t * cy + t * t * by\n    ];\n  }\n\n  function drawLinks(t) {\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    ctx.globalCompositeOperation = 'lighter';\n    for (let li = 0; li < LINKS.length; li++) {\n      const A = HUBS[LINKS[li][0]], B = HUBS[LINKS[li][1]];\n      const dx = B.wx - A.wx, dy = B.wy - A.wy;\n      const len = Math.hypot(dx, dy) || 1;\n      const nx = -dy / len, ny = dx / len;\n      const bow = len * 0.16;\n      const cx = (A.wx + B.wx) / 2 + nx * bow;\n      const cy = (A.wy + B.wy) / 2 + ny * bow;\n\n      const pa = project(A.wx, A.wy, A.wz);\n      const pb = project(B.wx, B.wy, B.wz);\n      const pc = project(cx, cy, (A.wz + B.wz) / 2);\n\n      // 纤维\n      ctx.beginPath();\n      ctx.moveTo(pa[0], pa[1]);\n      ctx.quadraticCurveTo(pc[0], pc[1], pb[0], pb[1]);\n      ctx.strokeStyle = 'rgba(196,212,255,' + (0.075 + energy * 0.1) + ')';\n      ctx.lineWidth = 1;\n      ctx.stroke();\n\n      // 沿纤维流动的光点\n      for (let k = 0; k < 2; k++) {\n        const u = ((t * (0.11 + energy * 0.14) + k * 0.5 + li * 0.21) % 1);\n        const p = qpt(pa[0], pa[1], pc[0], pc[1], pb[0], pb[1], u);\n        const fade = Math.sin(u * Math.PI);\n        ctx.globalAlpha = 0.55 * fade * (0.5 + energy * 0.7);\n        ctx.fillStyle = '#fff6e0';\n        ctx.beginPath();\n        ctx.arc(p[0], p[1], 1.5 + fade * 1.2, 0, TAU);\n        ctx.fill();\n      }\n      ctx.globalAlpha = 1;\n    }\n  }\n\n  // 锥形衍射星芒：中间最亮、向两端尖细消失\n  function drawSpike(x, y, ang, len, halfW, alpha, col) {\n    const ca = Math.cos(ang), sa = Math.sin(ang);\n    const px = -sa, py = ca;\n    const g = ctx.createLinearGradient(x - ca * len, y - sa * len, x + ca * len, y + sa * len);\n    g.addColorStop(0, 'rgba(' + col + ',0)');\n    g.addColorStop(0.5, 'rgba(' + col + ',' + alpha + ')');\n    g.addColorStop(1, 'rgba(' + col + ',0)');\n    ctx.fillStyle = g;\n    ctx.beginPath();\n    ctx.moveTo(x - ca * len, y - sa * len);\n    ctx.lineTo(x + px * halfW, y + py * halfW);\n    ctx.lineTo(x + ca * len, y + sa * len);\n    ctx.lineTo(x - px * halfW, y - py * halfW);\n    ctx.closePath();\n    ctx.fill();\n  }\n\n  function drawHubs(t) {\n    // 三颗光点同步闪烁：每 5s 齐亮一次\n    const cycle = 5.0;\n    const ph = t % cycle;\n    const flash = ph < 1.05 ? Math.pow(1 - ph / 1.05, 2.0) : 0;\n\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    ctx.globalCompositeOperation = 'lighter';\n\n    for (let i = 0; i < HUBS.length; i++) {\n      const h = HUBS[i];\n      const hov = (i === hoverIdx);\n      const idle = 0.5 + 0.5 * Math.sin(t * 1.35 + h.ph);\n      // 细微抖闪：两个不同频率叠加，模拟大气抖动\n      const shimmer = 1 + 0.07 * Math.sin(t * 2.1 + h.ph * 3.1) + 0.045 * Math.sin(t * 3.7 + h.ph * 1.7);\n      const pulse = 0.9 + idle * 0.12 + flash * 0.5 + energy * 0.2 + (hov ? 0.2 : 0);\n      const p = project(h.wx, h.wy, h.wz);\n      const hx = p[0], hy = p[1], ps = p[2] * zoom;\n      const r = h.r * pulse * ps;\n      const coreR = r * 0.62;\n      const L = r * 4.3 * shimmer + flash * r * 1.9;\n      const ang = (i - 1) * 0.12;   // 每颗芒角度略不同，避免复制感\n\n      // 1) 大范围 bloom：非常淡但铺得开，边缘融入夜空\n      let g = ctx.createRadialGradient(hx, hy, 0, hx, hy, r * 6.5);\n      g.addColorStop(0, 'rgba(255,248,232,' + (0.13 * pulse) + ')');\n      g.addColorStop(0.15, 'rgba(255,238,208,' + (0.07 * pulse) + ')');\n      g.addColorStop(0.45, 'rgba(224,206,178,' + (0.020 * pulse) + ')');\n      g.addColorStop(0.75, 'rgba(158,168,216,' + (0.007 * pulse) + ')');\n      g.addColorStop(1, 'rgba(140,150,210,0)');\n      ctx.fillStyle = g;\n      ctx.beginPath();\n      ctx.arc(hx, hy, r * 6.5, 0, TAU);\n      ctx.fill();\n\n      // 2) 衍射星芒：主横芒最长，纵芒次之，斜向两根弱芒\n      drawSpike(hx, hy, ang, L * 1.15, r * 0.13, 0.7, '255,250,238');\n      drawSpike(hx, hy, ang + Math.PI / 2, L * 0.78, r * 0.115, 0.5, '255,250,238');\n      drawSpike(hx, hy, ang + Math.PI / 4, L * 0.30, r * 0.06, 0.18, '255,244,220');\n      drawSpike(hx, hy, ang - Math.PI / 4, L * 0.30, r * 0.06, 0.18, '255,244,220');\n\n      // 3) 紧致内晕：白热 → 香槟金 → 微冷蓝的多段过渡\n      g = ctx.createRadialGradient(hx, hy, 0, hx, hy, r * 2.8);\n      g.addColorStop(0, 'rgba(255,255,255,0.9)');\n      g.addColorStop(0.16, 'rgba(255,250,236,0.46)');\n      g.addColorStop(0.40, 'rgba(255,236,200,0.16)');\n      g.addColorStop(0.72, 'rgba(226,210,190,0.055)');\n      g.addColorStop(1, 'rgba(180,190,230,0)');\n      ctx.fillStyle = g;\n      ctx.beginPath();\n      ctx.arc(hx, hy, r * 2.8, 0, TAU);\n      ctx.fill();\n\n      // 4) 白热内核：小而实，快速衰减\n      g = ctx.createRadialGradient(hx, hy, 0, hx, hy, coreR);\n      g.addColorStop(0, 'rgba(255,255,255,1)');\n      g.addColorStop(0.40, 'rgba(255,253,246,0.92)');\n      g.addColorStop(0.72, 'rgba(255,242,210,0.30)');\n      g.addColorStop(1, 'rgba(255,235,195,0)');\n      ctx.fillStyle = g;\n      ctx.beginPath();\n      ctx.arc(hx, hy, coreR, 0, TAU);\n      ctx.fill();\n\n      // 5) 交互提示环：弱化成一道若有若无的弧\n      ctx.strokeStyle = 'rgba(255,244,220,' + (0.07 + flash * 0.2 + (hov ? 0.16 : 0)) + ')';\n      ctx.lineWidth = 0.8;\n      ctx.beginPath();\n      ctx.arc(hx, hy, r * 1.75, t * 0.35 + h.ph, t * 0.35 + h.ph + Math.PI * 1.1);\n      ctx.stroke();\n    }\n\n    // 点击涟漪\n    for (let i = 0; i < ripples.length; i++) {\n      const rp = ripples[i];\n      const pr = project(rp.x, rp.y, rp.z);\n      ctx.strokeStyle = 'rgba(255,244,214,' + (rp.life * 0.5) + ')';\n      ctx.lineWidth = 1.2;\n      ctx.beginPath();\n      ctx.arc(pr[0], pr[1], rp.r * pr[2] * zoom, 0, TAU);\n      ctx.stroke();\n    }\n  }\n\n  // 流光：一条连续的光带（外层柔光晕 + 细亮芯 + 头部亮点）\n  function drawTrail() {\n    if (trail.length < 2) return;\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.lineCap = 'round';\n    ctx.lineJoin = 'round';\n    const n = trail.length;\n    for (let i = 1; i < n; i++) {\n      const p0 = trail[i - 1], p1 = trail[i];\n      const k = i / (n - 1);                 // 越新越亮越粗\n      const life = Math.min(p0.life, p1.life);\n      const hv = (p0.hov && p1.hov) ? 0.72 : 1;\n      // 外层柔光晕\n      ctx.strokeStyle = 'rgba(255,226,170,' + (0.16 * k * life * hv).toFixed(3) + ')';\n      ctx.lineWidth = 0.8 + k * 7.5;\n      ctx.beginPath();\n      ctx.moveTo(p0.x, p0.y);\n      ctx.lineTo(p1.x, p1.y);\n      ctx.stroke();\n      // 内芯亮线\n      ctx.strokeStyle = 'rgba(255,252,244,' + (0.42 * k * life * hv).toFixed(3) + ')';\n      ctx.lineWidth = 0.5 + k * 2.0;\n      ctx.beginPath();\n      ctx.moveTo(p0.x, p0.y);\n      ctx.lineTo(p1.x, p1.y);\n      ctx.stroke();\n    }\n    // 头部亮点：光带的源头\n    const head = trail[n - 1];\n    const hr = head.hov ? 2.2 : 3.2;\n    const g = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, hr * 3);\n    g.addColorStop(0, 'rgba(255,255,255,' + (0.75 * head.life).toFixed(3) + ')');\n    g.addColorStop(0.35, 'rgba(255,244,214,' + (0.30 * head.life).toFixed(3) + ')');\n    g.addColorStop(1, 'rgba(255,232,190,0)');\n    ctx.fillStyle = g;\n    ctx.beginPath();\n    ctx.arc(head.x, head.y, hr * 3, 0, TAU);\n    ctx.fill();\n  }\n\n  function drawVignette() {\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    ctx.globalCompositeOperation = 'source-over';\n    ctx.globalAlpha = 1;\n    ctx.fillStyle = vigGrad;\n    ctx.fillRect(0, 0, W, H);\n    ctx.fillStyle = bottomGrad;\n    ctx.fillRect(0, 0, W, H);\n  }\n\n  function syncLabels() {\n    for (let i = 0; i < HUBS.length; i++) {\n      const h = HUBS[i];\n      const p = project(h.wx, h.wy, h.wz);\n      const onScreen = p[0] > -160 && p[0] < W + 160 && p[1] > -120 && p[1] < H + 120;\n      h.el.style.opacity = onScreen ? '1' : '0';\n      h.el.style.transform = 'translate(-50%,-50%) translate(' +\n        (p[0] + h.dx).toFixed(1) + 'px,' + (p[1] + h.dy).toFixed(1) + 'px)';\n      h.el.classList.toggle('on', i === hoverIdx);\n    }\n  }\n\n  /* ---------------- 主循环 ---------------- */\n  function frame(now) {\n    if (!lastT) lastT = now;\n    let dt = (now - lastT) / 1000;\n    lastT = now;\n    dt = Math.min(dt, 0.05);\n    time += dt;\n\n    update(dt);\n\n    hoverIdx = pointer.in ? pickHub(pointer.x, pointer.y) : -1;\n    canvas.style.cursor = hoverIdx >= 0 ? 'pointer' : (pointer.down ? 'grabbing' : 'grab');\n\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    ctx.globalAlpha = 1;\n    ctx.globalCompositeOperation = 'source-over';\n\n    drawBackground(time);\n    drawStars(time);\n    drawLinks(time);\n    drawHubs(time);\n    drawTrail();\n\n    drawVignette();\n    syncLabels();\n\n    requestAnimationFrame(frame);\n  }\n\n  /* ---------------- 启动 ---------------- */\n  resize();\n  buildHubLabels();\n  bindEvents();\n  requestAnimationFrame(frame);\n\n  // 调试：地址加 ?debug 时把投影坐标写进 title（便于自动化核对）\n  if (location.search.indexOf('debug') >= 0) {\n    setTimeout(function () {\n      const arr = HUBS.map(function (h) {\n        const p = project(h.wx, h.wy);\n        return h.id + ':' + Math.round(p[0]) + ',' + Math.round(p[1]);\n      });\n      document.title = 'DBG ' + W + 'x' + H + ' rot=' + rot.toFixed(3) + ' rotY=' + rotY.toFixed(3) + ' rotX=' + rotX.toFixed(3) + ' zoom=' + zoom.toFixed(2) + ' | ' + arr.join(' ');\n    }, 1500);\n  }\n\n  // 暴露给外部（后续接功能路由 / 滚动联动）\n  window.AuroraHome = {\n    hubs: HUBS,\n    goTo: function (id) {\n      for (let i = 0; i < HUBS.length; i++) {\n        if (HUBS[i].id === id) { triggerHub(HUBS[i]); return true; }\n      }\n      return false;\n    },\n    setEnergy: function (v) { tEnergy = clamp(v, 0, 1); },\n    reset: function () { panX = panY = 0; rot = 0; vx = vy = 0; rotVel = 0; rotX = rotY = 0; rotXVel = rotYVel = 0; tZoom = 1; }\n  };\n})();\n<\/script>\n<script>\n/* nav.js —— 让同一套页面既能单独打开，也能装进单文件外壳的 iframe 里。\n *\n * 单独打开（window.parent === window）：链接正常跳转，什么都不做。\n * 在 iframe 里（单文件版外壳）：拦截页面内到其它页的链接，向父窗口发\n *   {nav: \"explore\"} 这样的消息，由外壳切换 iframe，避免整页重新加载。\n */\n(function () {\n  'use strict';\n\n  // 页面文件名 → 外壳里的 key。新增页面时在这里登记。\n  var MAP = {\n    'home.html': 'home',\n    'explore.html': 'explore',\n    'connect.html': 'connect',\n    'lab.html': 'lab'\n  };\n\n  var inFrame = false;\n  try { inFrame = window.parent && window.parent !== window; } catch (e) { inFrame = false; }\n  if (!inFrame) return;   // 单独打开：交给浏览器默认行为\n\n  function navigate(target) {\n    var key = MAP[target];\n    if (!key) return false;\n    parent.postMessage({ nav: key }, '*');\n    return true;\n  }\n\n  // 暴露给页面自己的 JS 用（如首页星图入口、游戏开始按钮）\n  window.auroraNav = navigate;\n  window.auroraInFrame = true;\n\n  // 捕获阶段拦截所有指向本组页面的 <a>\n  document.addEventListener('click', function (e) {\n    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n    if (!a) return;\n    var href = a.getAttribute('href') || '';\n    // 剥掉 query / hash，只比较文件名\n    var file = href.split('#')[0].split('?')[0].split('/').pop();\n    if (navigate(file)) e.preventDefault();\n  }, true);\n})();\n\n<\/script>\n\n<\/body>\n<\/html>\n",
"explore":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\n<title>AURORA · 沉浸浏览<\/title>\n<style>\n  *{margin:0;padding:0;box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{\n    background:#02040a;\n    font-family:\"Helvetica Neue\",-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n    color:#eef3ff;-webkit-font-smoothing:antialiased;\n    overflow-x:hidden;\n  }\n  #sky{position:fixed;inset:0;z-index:0;display:block;}\n\n  /* ---------- 顶栏 ---------- */\n  .top{\n    position:fixed;top:0;left:0;right:0;z-index:10;\n    display:flex;justify-content:space-between;align-items:center;\n    padding:clamp(18px,2.6vw,30px) clamp(22px,3.4vw,46px);\n    background:linear-gradient(to bottom,rgba(2,4,10,.82),rgba(2,4,10,0));\n  }\n  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}\n  .brand .dot{\n    width:7px;height:7px;border-radius:50%;background:#fff;\n    box-shadow:0 0 10px 2px rgba(255,238,205,.9),0 0 26px 8px rgba(226,190,126,.35);\n    animation:breathe 4s ease-in-out infinite;\n  }\n  @keyframes breathe{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}\n  .brand b{\n    font-size:13px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;\n    color:#f8f4e9;text-shadow:0 0 18px rgba(255,236,198,.45);\n  }\n  .back{\n    display:flex;align-items:center;gap:8px;\n    font-size:11px;letter-spacing:.24em;color:rgba(214,226,248,.6);\n    text-decoration:none;padding:8px 4px;\n    transition:color .3s;\n  }\n  .back:hover{color:#f6d9a4;}\n  .back::before{\n    content:\"←\";font-size:13px;opacity:.65;line-height:1;\n    transition:transform .3s,opacity .3s;\n  }\n  .back:hover::before{transform:translateX(-3px);opacity:1;}\n\n  /* ---------- 右侧进度 ---------- */\n  .rail{\n    position:fixed;right:clamp(16px,2.6vw,34px);top:50%;transform:translateY(-50%);\n    z-index:10;display:flex;flex-direction:column;gap:0;align-items:center;\n  }\n  .rail .node{\n    width:22px;height:22px;display:flex;align-items:center;justify-content:center;\n    cursor:pointer;pointer-events:auto;\n  }\n  .rail .node i{\n    width:5px;height:5px;border-radius:50%;\n    background:rgba(214,226,248,.28);transition:all .4s;\n  }\n  .rail .node.on i{\n    background:#fff;\n    box-shadow:0 0 8px 2px rgba(255,238,205,.8),0 0 20px 6px rgba(226,190,126,.3);\n    transform:scale(1.4);\n  }\n  .rail .seg{width:1px;height:clamp(26px,4.4vh,44px);background:rgba(255,255,255,.10);}\n  .rail .tip{\n    position:absolute;right:26px;white-space:nowrap;\n    font-size:10px;letter-spacing:.22em;color:rgba(240,214,164,.0);\n    transition:color .3s;pointer-events:none;\n  }\n  .rail .node:hover .tip,.rail .node.on .tip{color:rgba(240,214,164,.85);}\n\n  /* ---------- 章节 ---------- */\n  main{position:relative;z-index:2;}\n  .sec{\n    min-height:100vh;\n    display:flex;flex-direction:column;justify-content:center;\n    padding:16vh clamp(26px,8vw,140px);\n    max-width:1200px;margin:0 auto;\n  }\n  .sec .kicker{\n    font-size:11px;letter-spacing:.42em;text-transform:uppercase;\n    color:rgba(238,205,150,.75);margin-bottom:26px;\n    display:flex;align-items:center;gap:14px;\n  }\n  .sec .kicker::before{content:\"\";width:34px;height:1px;background:rgba(238,205,150,.4);}\n  .sec h2{\n    font-size:clamp(30px,4.6vw,54px);font-weight:300;letter-spacing:.1em;\n    line-height:1.28;color:#f8f4e9;\n    text-shadow:0 2px 30px rgba(0,0,0,.9),0 0 40px rgba(255,236,198,.12);\n    margin-bottom:30px;\n  }\n  .sec h2 em{font-style:normal;color:#f6dfb6;}\n  .sec p{\n    font-size:clamp(14px,1.35vw,17px);font-weight:300;line-height:2.15;\n    letter-spacing:.08em;color:rgba(220,230,250,.72);\n    max-width:640px;\n    text-shadow:0 1px 14px rgba(0,0,0,.9);\n  }\n  .sec p+p{margin-top:18px;}\n  .sec p b{color:#f6e7c8;font-weight:500;}\n  .sec .go{\n    margin-top:44px;display:inline-flex;align-items:center;gap:12px;\n    font-size:12px;letter-spacing:.3em;color:#f6d9a4;text-decoration:none;\n    transition:letter-spacing .35s,color .35s;\n    width:max-content;\n  }\n  .sec .go::after{\n    content:\"\";width:44px;height:1px;background:rgba(246,217,164,.55);\n    transition:width .35s;\n  }\n  .sec .go:hover{letter-spacing:.4em;color:#fff;}\n  .sec .go:hover::after{width:66px;background:#fff;}\n\n  /* 首屏 */\n  .hero{align-items:center;text-align:center;}\n  .hero h2{font-size:clamp(40px,7vw,84px);font-weight:200;letter-spacing:.3em;margin-bottom:22px;}\n  .hero .sub{\n    font-size:clamp(12px,1.3vw,15px);letter-spacing:.5em;color:rgba(214,226,248,.55);\n    text-transform:uppercase;\n  }\n  .hero .kicker{justify-content:center;}\n  .hero .kicker::after{content:\"\";width:34px;height:1px;background:rgba(238,205,150,.4);}\n\n  /* 尾屏 */\n  .fin{align-items:center;text-align:center;}\n  .fin p{max-width:520px;}\n  .links{margin-top:52px;display:flex;gap:clamp(24px,5vw,72px);flex-wrap:wrap;justify-content:center;}\n  .links a{\n    font-size:12px;letter-spacing:.32em;color:#f6d9a4;text-decoration:none;\n    padding:10px 2px;border-bottom:1px solid rgba(246,217,164,.28);\n    transition:color .3s,border-color .3s;\n  }\n  .links a:hover{color:#fff;border-color:rgba(255,255,255,.7);}\n\n  /* 数字装饰 */\n  .sec .num{\n    position:absolute;right:clamp(8px,4vw,60px);top:50%;transform:translateY(-50%);\n    font-size:clamp(90px,16vw,220px);font-weight:200;letter-spacing:0;\n    color:transparent;-webkit-text-stroke:1px rgba(214,226,248,.10);\n    pointer-events:none;user-select:none;\n  }\n  .sec{position:relative;}\n\n  /* 入场动画 */\n  .rv{opacity:0;transform:translateY(46px);transition:opacity 1.1s cubic-bezier(.2,.6,.2,1),transform 1.1s cubic-bezier(.2,.6,.2,1);}\n  .rv.d1{transition-delay:.12s;}\n  .rv.d2{transition-delay:.26s;}\n  .rv.d3{transition-delay:.4s;}\n  .sec.vis .rv{opacity:1;transform:none;}\n\n  /* 底部渐隐融合 */\n  .fadeEdge{\n    position:fixed;left:0;right:0;bottom:0;height:12vh;z-index:3;pointer-events:none;\n    background:linear-gradient(to bottom,rgba(2,4,10,0),rgba(2,4,10,.55));\n  }\n\n  @media (max-width:640px){\n    .rail{right:6px}\n    .rail .tip{display:none}\n    .sec{padding-left:24px;padding-right:34px;}\n    .sec .num{opacity:.5}\n    .back{letter-spacing:.16em}\n  }\n<\/style>\n<\/head>\n<body>\n<canvas id=\"sky\"><\/canvas>\n\n<header class=\"top\">\n  <a class=\"brand\" href=\"home.html\"><i class=\"dot\"><\/i><b>Aurora Lab<\/b><\/a>\n  <a class=\"back\" href=\"home.html\">返回星海<\/a>\n<\/header>\n\n<nav class=\"rail\" id=\"rail\"><\/nav>\n\n<main>\n  <section class=\"sec hero\" id=\"s0\" data-name=\"序幕\">\n    <div class=\"kicker rv\">Immersion<\/div>\n    <h2 class=\"rv d1\">沉 浸 浏 览<\/h2>\n    <div class=\"sub rv d2\">Scroll · 银河之下的一次慢速漂流<\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s1\" data-name=\"缘起\">\n    <div class=\"num\">01<\/div>\n    <div class=\"kicker rv\">Origin<\/div>\n    <h2 class=\"rv d1\">当思绪<em>有了形状<\/em><\/h2>\n    <p class=\"rv d2\">我们总以为意识是看不见的。但在脑电图的波形里，每一次专注、每一次走神、每一次眨眼，都留下微弱的痕迹——像夜里划过的星，<b>短暂，却真实存在<\/b>。<\/p>\n    <p class=\"rv d3\">这个项目想做的，就是把这些痕迹挂到天上：让脑波成为星海，让注视成为航行。<\/p>\n  <\/section>\n\n  <section class=\"sec\" id=\"s2\" data-name=\"神经元\">\n    <div class=\"num\">02<\/div>\n    <div class=\"kicker rv\">Neurons<\/div>\n    <h2 class=\"rv d1\">神经元，是<em>最小的星<\/em><\/h2>\n    <p class=\"rv d2\">一颗神经元看起来像宇宙的微缩模型：轴突伸向远方，树突彼此靠近又彼此孤离，突触之间以电流与递质传递消息——正如星光跨越光年抵达另一颗星。<\/p>\n    <p class=\"rv d3\">首页那片缓缓流动的银汉，三个亮起的入口，就是按这个隐喻画出来的：<b>每一次同步闪烁，都是一次神经信号的齐放。<\/b><\/p>\n  <\/section>\n\n  <section class=\"sec\" id=\"s3\" data-name=\"眨眼飞行\">\n    <div class=\"num\">03<\/div>\n    <div class=\"kicker rv\">Play<\/div>\n    <h2 class=\"rv d1\">眨一下眼，<em>就飞过一颗星<\/em><\/h2>\n    <p class=\"rv d2\">在实验室里，你戴上脑电环，一条实时波形在屏幕左侧游走。当软件捕捉到你眨眼的瞬间，那只小小的飞船便向上跳跃，穿过一道道玻璃管道。<\/p>\n    <p class=\"rv d3\">不借助手，不借助键盘——<b>身体最本能的动作，成了唯一的控制器。<\/b>这是整个项目最接近\"魔法\"的一刻。<\/p>\n    <a class=\"go rv d3\" href=\"lab.html\">进入脑波实验室<\/a>\n  <\/section>\n\n  <section class=\"sec\" id=\"s4\" data-name=\"个性化\">\n    <div class=\"num\">04<\/div>\n    <div class=\"kicker rv\">Personal<\/div>\n    <h2 class=\"rv d1\">你的星海，<em>由你定义<\/em><\/h2>\n    <p class=\"rv d2\">每个人注视夜空的心情不同。你可以把这片星海换成极光、换成暖金，也可以写下此刻的感受——它们会像漂流瓶一样，被存在你自己的浏览器里。<\/p>\n    <a class=\"go rv d3\" href=\"connect.html\">去定制与反馈<\/a>\n  <\/section>\n\n  <section class=\"sec fin\" id=\"s5\" data-name=\"终章\">\n    <div class=\"kicker rv\">Fin<\/div>\n    <h2 class=\"rv d1\">仰望，<em>即是参与<\/em><\/h2>\n    <p class=\"rv d2\">当足够多的人开始在意自己脑中的光，意识就不再只是生理名词——它有了可以被注视、被把玩、被分享的形状。<\/p>\n    <div class=\"links rv d3\">\n      <a href=\"home.html\">回到星海<\/a>\n      <a href=\"lab.html\">脑波实验室<\/a>\n      <a href=\"connect.html\">关于与反馈<\/a>\n    <\/div>\n  <\/section>\n<\/main>\n\n<div class=\"fadeEdge\"><\/div>\n\n<script>\n(function () {\n  'use strict';\n\n  /* ---------------- 星海背景（滚动视差版） ---------------- */\n  const TAU = Math.PI * 2;\n  function mulberry32(a) {\n    return function () {\n      a |= 0; a = (a + 0x6D2B79F5) | 0;\n      let t = Math.imul(a ^ (a >>> 15), 1 | a);\n      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n  }\n  const rnd = mulberry32(20261108);\n  const rr = (a, b) => a + rnd() * (b - a);\n\n  const canvas = document.getElementById('sky');\n  const ctx = canvas.getContext('2d', { alpha: false });\n  let W = 0, H = 0, DPR = 1, R = 0;\n  let stars = [], neb = null, bgGrad = null;\n  let scrollY = 0, scrollN = 0;\n  let time = 0, lastT = 0;\n\n  const FLOW = { x: -0.882, y: 0.471 };\n  const STAR_COLORS = [\n    '#ffffff', '#ffffff', '#ffffff', '#f8fbff',\n    '#e9f0ff', '#fff6e2', '#f6dfb6', '#e8c78d'\n  ];\n\n  function resize() {\n    DPR = Math.min(window.devicePixelRatio || 1, 2);\n    W = window.innerWidth;\n    H = window.innerHeight;\n    canvas.width = Math.round(W * DPR);\n    canvas.height = Math.round(H * DPR);\n    canvas.style.width = W + 'px';\n    canvas.style.height = H + 'px';\n    R = Math.hypot(W, H) * 0.9;\n    buildStars();\n    buildGradients();\n  }\n\n  function buildStars() {\n    stars = [];\n    const dens = Math.min(W, H) < 720 ? 0.5 : 1;\n    const layers = [\n      { n: 420, sp: 4, size: [0.45, 1.0], a: 0.55, depth: 0.25 },\n      { n: 300, sp: 9, size: [0.6, 1.4], a: 0.75, depth: 0.55 },\n      { n: 140, sp: 18, size: [0.9, 1.9], a: 0.9, depth: 1 }\n    ];\n    for (let li = 0; li < layers.length; li++) {\n      const L = layers[li];\n      for (let i = 0; i < Math.round(L.n * dens); i++) {\n        stars.push({\n          x: rr(-R, R), y: rr(-R, R),\n          sp: L.sp * rr(0.7, 1.3),\n          sz: rr(L.size[0], L.size[1]),\n          a: L.a * rr(0.65, 1),\n          col: STAR_COLORS[(rnd() * STAR_COLORS.length) | 0],\n          tw: rr(0.7, 2.6), ph: rr(0, TAU),\n          depth: L.depth\n        });\n      }\n    }\n    // 沿斜向银河带铺一层细碎星尘\n    for (let i = 0; i < Math.round(1300 * dens); i++) {\n      const along = rr(-1, 1) * R * 0.95;\n      const perp = (rnd() + rnd() + rnd() - 1.5) * R * 0.10;\n      stars.push({\n        x: -0.707 * along + 0.707 * perp,\n        y: 0.707 * along + 0.707 * perp,\n        sp: rr(2, 7), sz: rr(0.3, 0.9), a: rr(0.28, 0.85),\n        col: rnd() < 0.2 ? '#ffeecd' : STAR_COLORS[(rnd() * 4) | 0],\n        tw: rr(0.6, 2.2), ph: rr(0, TAU),\n        depth: rnd() < 0.3 ? 0.7 : 0.3\n      });\n    }\n    // 少量光晕亮星\n    for (let i = 0; i < 14; i++) {\n      stars.push({\n        x: rr(-R, R), y: rr(-R, R),\n        sp: rr(3, 7), sz: rr(1.3, 2.2), a: rr(0.7, 1),\n        col: rnd() < 0.7 ? '#ffffff' : '#ffeecd',\n        tw: rr(0.5, 1.4), ph: rr(0, TAU),\n        depth: rr(0.4, 1), glow: true\n      });\n    }\n  }\n\n  function buildNebula() {\n    const SZ = 1000;\n    neb = document.createElement('canvas');\n    neb.width = SZ; neb.height = SZ;\n    const g = neb.getContext('2d');\n    const pal = [\n      [70, 112, 190], [86, 96, 200], [46, 82, 150],\n      [150, 176, 240], [246, 222, 184], [210, 178, 132]\n    ];\n    g.globalCompositeOperation = 'lighter';\n    for (let i = 0; i < 130; i++) {\n      const u = rnd();\n      const along = -0.55 + u * 1.1;\n      const n = (rnd() + rnd() + rnd() - 1.5) * 0.185;\n      const x = SZ * 0.5 + (along * 0.707 - n * 0.707) * SZ * 1.05;\n      const y = SZ * 0.5 + (-along * 0.707 - n * 0.707) * SZ * 1.05;\n      const r = rr(SZ * 0.035, SZ * 0.10);\n      const c = pal[(rnd() * pal.length) | 0];\n      const a = rr(0.010, 0.028);\n      const rad = g.createRadialGradient(x, y, 0, x, y, r);\n      rad.addColorStop(0, 'rgba(' + c.join(',') + ',' + a + ')');\n      rad.addColorStop(0.5, 'rgba(' + c.join(',') + ',' + (a * 0.3) + ')');\n      rad.addColorStop(1, 'rgba(' + c.join(',') + ',0)');\n      g.fillStyle = rad;\n      g.fillRect(x - r, y - r, r * 2, r * 2);\n    }\n    for (let i = 0; i < 40; i++) {\n      const u = i / 39;\n      const along = -0.55 + u * 1.10;\n      const n = (rnd() - 0.5) * 0.055;\n      const x = SZ * 0.5 + (along * 0.707 - n * 0.707) * SZ * 1.02;\n      const y = SZ * 0.5 + (-along * 0.707 - n * 0.707) * SZ * 1.02;\n      const r = rr(SZ * 0.055, SZ * 0.11);\n      const mid = Math.sin(u * Math.PI);\n      const a = rr(0.05, 0.09) * (0.35 + mid * 0.95);\n      const rad = g.createRadialGradient(x, y, 0, x, y, r);\n      rad.addColorStop(0, 'rgba(255,250,238,' + a + ')');\n      rad.addColorStop(0.35, 'rgba(214,228,255,' + (a * 0.42) + ')');\n      rad.addColorStop(1, 'rgba(150,180,255,0)');\n      g.fillStyle = rad;\n      g.fillRect(x - r, y - r, r * 2, r * 2);\n    }\n    const cx = SZ * 0.66, cy = SZ * 0.34;\n    const cg = g.createRadialGradient(cx, cy, 0, cx, cy, SZ * 0.24);\n    cg.addColorStop(0, 'rgba(255,250,236,0.16)');\n    cg.addColorStop(0.18, 'rgba(255,234,200,0.11)');\n    cg.addColorStop(0.5, 'rgba(150,185,255,0.04)');\n    cg.addColorStop(1, 'rgba(110,145,235,0)');\n    g.fillStyle = cg;\n    g.fillRect(0, 0, SZ, SZ);\n  }\n\n  function buildGradients() {\n    bgGrad = ctx.createLinearGradient(0, 0, W * 0.35, H);\n    bgGrad.addColorStop(0, '#070c18');\n    bgGrad.addColorStop(0.42, '#08101f');\n    bgGrad.addColorStop(1, '#03050c');\n  }\n\n  function frame(now) {\n    if (!lastT) lastT = now;\n    let dt = Math.min((now - lastT) / 1000, 0.05);\n    lastT = now;\n    time += dt;\n    scrollN += (scrollY - scrollN) * Math.min(1, dt * 3.2);\n\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    ctx.globalCompositeOperation = 'source-over';\n    ctx.fillStyle = bgGrad;\n    ctx.fillRect(0, 0, W, H);\n\n    // 星云：随滚动轻微下沉\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.save();\n    ctx.translate(W / 2, H * 0.42 - scrollN * 0.05 % (H * 2));\n    ctx.rotate(0.29);\n    const ns = (Math.hypot(W, H) * 1.24) / neb.width;\n    ctx.scale(ns, ns);\n    ctx.globalAlpha = 0.55;\n    ctx.drawImage(neb, -neb.width / 2, -neb.height / 2);\n    ctx.restore();\n    ctx.globalAlpha = 1;\n\n    // 星星：视差 + 缓慢流动\n    ctx.globalCompositeOperation = 'lighter';\n    for (let i = 0; i < stars.length; i++) {\n      const s = stars[i];\n      s.x += FLOW.x * s.sp * dt;\n      s.y += FLOW.y * s.sp * dt;\n      if (s.x < -R) s.x += R * 2;\n      if (s.y > R) s.y -= R * 2;\n\n      const px = W / 2 + s.x * (0.9 + s.depth * 0.1);\n      const py = H / 2 + s.y * (0.9 + s.depth * 0.1) - scrollN * s.depth * 0.22;\n      if (px < -60 || px > W + 60 || py < -60 || py > H + 60) continue;\n\n      const tw = 0.62 + 0.38 * Math.sin(time * s.tw + s.ph);\n      let a = s.a * (0.55 + tw * 0.6);\n      if (a <= 0.012) continue;\n\n      if (s.glow) {\n        const gr = s.sz * 7;\n        const g2 = ctx.createRadialGradient(px, py, 0, px, py, gr);\n        g2.addColorStop(0, 'rgba(255,255,255,' + Math.min(1, a) + ')');\n        g2.addColorStop(0.12, 'rgba(255,252,240,' + (a * 0.8) + ')');\n        g2.addColorStop(0.32, 'rgba(255,238,204,' + (a * 0.18) + ')');\n        g2.addColorStop(1, 'rgba(255,226,180,0)');\n        ctx.fillStyle = g2;\n        ctx.beginPath(); ctx.arc(px, py, gr, 0, TAU); ctx.fill();\n        continue;\n      }\n\n      ctx.globalAlpha = Math.min(1, a * 1.1);\n      ctx.fillStyle = s.col;\n      if (s.sz < 0.85) {\n        ctx.fillRect(px - 0.55, py - 0.55, 1.1, 1.1);\n      } else {\n        ctx.beginPath(); ctx.arc(px, py, s.sz * 0.62, 0, TAU); ctx.fill();\n        if (s.sz > 1.5) {\n          const l = s.sz * 5.5;\n          ctx.globalAlpha = Math.min(0.4, a * 0.4);\n          ctx.strokeStyle = s.col; ctx.lineWidth = 0.7;\n          ctx.beginPath();\n          ctx.moveTo(px - l, py); ctx.lineTo(px + l, py);\n          ctx.moveTo(px, py - l); ctx.lineTo(px, py + l);\n          ctx.stroke();\n        }\n      }\n    }\n    ctx.globalAlpha = 1;\n\n    // 暗角\n    ctx.globalCompositeOperation = 'source-over';\n    const vg = ctx.createRadialGradient(W / 2, H * 0.48, Math.min(W, H) * 0.3, W / 2, H * 0.48, Math.hypot(W, H) * 0.7);\n    vg.addColorStop(0, 'rgba(2,4,10,0)');\n    vg.addColorStop(1, 'rgba(1,2,6,0.55)');\n    ctx.fillStyle = vg;\n    ctx.fillRect(0, 0, W, H);\n\n    requestAnimationFrame(frame);\n  }\n\n  /* ---------------- 章节进入动画 + 侧边导航 ---------------- */\n  const secs = Array.prototype.slice.call(document.querySelectorAll('.sec'));\n  const rail = document.getElementById('rail');\n\n  secs.forEach(function (sec, i) {\n    if (i > 0) {\n      const seg = document.createElement('i');\n      seg.className = 'seg';\n      rail.appendChild(seg);\n    }\n    const node = document.createElement('div');\n    node.className = 'node';\n    node.innerHTML = '<i><\/i><span class=\"tip\">' + sec.dataset.name + '<\/span>';\n    node.addEventListener('click', function () {\n      sec.scrollIntoView({ behavior: 'smooth' });\n    });\n    rail.appendChild(node);\n    sec.__node = node;\n  });\n\n  if ('IntersectionObserver' in window) {\n    const io = new IntersectionObserver(function (entries) {\n      entries.forEach(functio "connect":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\n<title>AURORA · 关于与反馈<\/title>\n<style>\n  *{margin:0;padding:0;box-sizing:border-box;}\n  html,body{height:100%;}\n  body{\n    background:#02040a;\n    font-family:\"Helvetica Neue\",-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n    color:#eef3ff;-webkit-font-smoothing:antialiased;\n    overflow-x:hidden;\n  }\n  #sky{position:fixed;inset:0;z-index:0;display:block;transition:opacity .6s;}\n  :root{\n    --accent:#f6d9a4;\n    --accent-soft:rgba(246,217,164,.75);\n    --accent-line:rgba(246,217,164,.32);\n  }\n  body.theme-aurora{\n    --accent:#a8f0dc;\n    --accent-soft:rgba(168,240,220,.75);\n    --accent-line:rgba(168,240,220,.32);\n  }\n  body.theme-amber{\n    --accent:#ffc98a;\n    --accent-soft:rgba(255,201,138,.8);\n    --accent-line:rgba(255,201,138,.35);\n  }\n\n  /* ---------- 顶栏 ---------- */\n  .top{\n    position:fixed;top:0;left:0;right:0;z-index:10;\n    display:flex;justify-content:space-between;align-items:center;\n    padding:clamp(18px,2.6vw,30px) clamp(22px,3.4vw,46px);\n    background:linear-gradient(to bottom,rgba(2,4,10,.82),rgba(2,4,10,0));\n  }\n  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}\n  .brand .dot{\n    width:7px;height:7px;border-radius:50%;background:#fff;\n    box-shadow:0 0 10px 2px rgba(255,238,205,.9),0 0 26px 8px rgba(226,190,126,.35);\n    animation:breathe 4s ease-in-out infinite;\n  }\n  @keyframes breathe{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}\n  .brand b{\n    font-size:13px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;\n    color:#f8f4e9;text-shadow:0 0 18px rgba(255,236,198,.45);\n  }\n  .back{\n    font-size:11px;letter-spacing:.24em;color:rgba(214,226,248,.6);\n    text-decoration:none;padding:8px 4px;transiti
